<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自我介紹轉盤｜破冰遊戲</title>
<style>
:root{
  --ink:#182536; --muted:#607083; --paper:#f7f3eb; --white:#fffdf9;
  --teal:#087f83; --teal-soft:#dff1ee; --orange:#ec7d3a; --orange-soft:#fae6d7;
  --yellow:#f4c84b; --yellow-soft:#fff4c9; --purple:#7565a8; --purple-soft:#ece8f7;
  --green:#2e8a62; --red:#bd4b4b; --line:#d8d7d1; --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;background:rgba(24,37,54,.98);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--orange)}
.home-btn{margin-left:auto;text-decoration:none;font-size:14px;font-weight:800;color:#1a1004;background:var(--orange);padding:9px 18px;border-radius:999px;white-space:nowrap;transition:.15s}
.home-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(236,125,58,.4)}
.after-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.after-row a{text-decoration:none;font-size:17px;font-weight:800;padding:16px 34px;border-radius:14px;transition:.15s}
.after-row a:hover{transform:translateY(-2px)}
.after-row .h{background:var(--orange);color:#1a1004}
.after-row .g{background:var(--green);color:#fff}
.brand{font-size:18px;font-weight:800}.case{color:#b8cbd0;font-size:13px}
.shell{max-width:1180px;margin:0 auto;padding:26px 22px 56px}
h1{font-size:clamp(26px,4vw,40px);margin:0 0 6px}h2{font-size:22px;margin:0}
.eyebrow{font-size:13px;color:var(--teal);font-weight:800;letter-spacing:.1em;text-transform:uppercase}.muted{color:var(--muted)}
.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:800;font-size:16px;transition:.16s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--teal);color:#fff}.btn.orange{background:var(--orange);color:#fff}.btn.secondary{background:var(--white);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.panel.soft-yellow{background:var(--yellow-soft);border-color:#eadb9c}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.wheel-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.wheel-box{position:relative;width:440px;height:440px}
canvas{display:block;width:100%;height:100%}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--orange);z-index:5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.center-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--yellow);font-weight:900;font-size:13px;text-align:center;z-index:4}
.config{display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px}.tab{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--white);font-weight:800;color:var(--muted)}.tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
.field textarea{min-height:110px;resize:vertical}
.result-box{min-height:150px;border:2px dashed #b5c4c0;border-radius:14px;padding:18px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.result-box .who{font-size:30px;font-weight:900;color:var(--ink)}
.result-box .q{font-size:19px;color:var(--teal);font-weight:700}
.result-box .hint{font-size:13px;color:var(--muted)}
.done-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.done-chip{padding:5px 10px;border-radius:999px;background:var(--green);color:#fff;font-size:13px;font-weight:700}
.hint-bar{margin-top:16px;padding:14px 16px;border-radius:11px;background:var(--teal-soft);color:var(--teal);font-size:14px;font-weight:700}
@media(max-width:820px){.two-col{grid-template-columns:1fr}.wheel-box{width:320px;height:320px}.topbar{padding:12px 16px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand">自我介紹轉盤</div><div class="case">破冰遊戲 · 第一課</div><a class="home-btn" href="https://wilkat2009-droid.github.io/cola-pages/vch1101/">🏠 返回課堂總台</a></header>
  <main class="shell">
    <div class="eyebrow">Icebreaker</div>
    <h1>轉到誰，誰來介紹自己</h1>
    <p class="muted">轉盤隨機選人，壓力交給機器。每人配一道輕問題，一句話就能答。</p>

    <div class="two-col">
      <div class="wheel-wrap">
        <div class="wheel-box">
          <div class="pointer"></div>
          <canvas id="wheel" width="880" height="880"></canvas>
          <div class="center-dot">轉一下</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn orange" id="spinBtn">🎡 轉一下</button>
          <button class="btn secondary" id="skipBtn">跳過（重新轉）</button>
        </div>
      </div>

      <div class="config">
        <div class="tabs">
          <button class="tab active" id="tabNum">號碼模式</button>
          <button class="tab" id="tabName">名字模式</button>
        </div>
        <div class="field" id="numField">
          <label>學生人數（號碼 1 到 N）</label>
          <input type="number" id="numCount" value="32" min="2" max="40">
        </div>
        <div class="field" id="nameField" style="display:none">
          <label>貼入名字（用逗號或換行分隔）</label>
          <textarea id="nameList" placeholder="例如：小明, 小美, 阿強"></textarea>
        </div>
        <button class="btn primary" id="applyBtn" style="align-self:flex-start">套用</button>

        <div class="result-box" id="resultBox">
          <div class="hint">按「轉一下」開始</div>
        </div>

        <div class="panel soft-yellow">
          <div class="field">
            <label>已介紹過（可點名字移除，重新放回轉盤）</label>
            <div class="done-list" id="doneList"><span class="muted" style="font-size:13px">還沒有人介紹</span></div>
          </div>
        </div>

        <div class="hint-bar">提示：每個人有 1 次「跳過」機會。老師先示範一次，氣氛就鬆了。</div>
      </div>
    </div>

    <div class="after-row">
      <a class="h" href="https://wilkat2009-droid.github.io/cola-pages/vch1101/">🏠 轉完了，回到主屏幕</a>
      <a class="g" href="https://wilkat2009-droid.github.io/cola-pages/vch1101-lesson1/">🔍 直接開課：錯字偵探社</a>
    </div>
  </main>
</div>

<script>
const questions=[
 '你最喜歡吃甚麼？',
 '你最近在追甚麼（劇／遊戲／影片）？',
 '用一種動物形容你今天的狀態？',
 '你最常寫錯的一個字？',
 '你希望這學期學會甚麼？',
 '說一樣你最討厭的食物？',
 '如果你有超能力，你想要甚麼？',
 '你最想去哪裡旅行？',
 '你的名字有沒有甚麼意思或故事？',
 '說一個你覺得自己很酷的小技能？'
];
const palette=['#087f83','#ec7d3a','#7565a8','#2e8a62','#f4c84b','#3b7fbd','#bd4b4b','#5b8a2e','#e0a020','#4a8a8a'];
let mode='num';
let labels=[];       // current segment labels
let active=new Set(); // indices still in play
let rotation=0;      // current wheel rotation degrees
let spinning=false;
let lastResult=-1;

const canvas=document.getElementById('wheel'); const ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s);

function buildLabels(){
  if(mode==='num'){ const n=parseInt($('#numCount').value,10)||32; labels=Array.from({length:n},(_,i)=>String(i+1)); }
  else{ const raw=$('#nameList').value.trim(); labels=raw.split(/[,，\n、]/).map(s=>s.trim()).filter(Boolean); if(!labels.length) labels=['小明','小美','阿強']; }
  active=new Set(labels.map((_,i)=>i));
  updateDoneList();
  draw();
}
function draw(){
  const n=labels.length; const seg=360/n;
  ctx.clearRect(0,0,880,880);
  const cx=440, cy=440, r=410;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rotation*Math.PI/180);
  for(let i=0;i<n;i++){
    const start=(i*seg)*Math.PI/180, end=((i+1)*seg)*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,start,end); ctx.closePath();
    ctx.fillStyle=active.has(i)?palette[i%palette.length]:'#d8d7d1';
    ctx.fill(); ctx.strokeStyle='#fffdf9'; ctx.lineWidth=3; ctx.stroke();
    // label
    ctx.save(); ctx.rotate((i*seg+seg/2)*Math.PI/180);
    ctx.fillStyle=active.has(i)?'#ffffff':'#9aa4ad';
    ctx.font='700 '+(n>24?23:34)+'px Microsoft JhengHei, PingFang TC, sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    const label=labels[i]; const display=label.length>6?label.slice(0,6)+'…':label;
    ctx.fillText(display, r-34, 0);
    ctx.restore();
  }
  ctx.restore();
}
function getWinner(){
  const n=labels.length; const seg=360/n;
  const normalized=((360-(rotation%360))%360);
  return Math.floor(normalized/seg)%n;
}
function spin(){
  if(spinning||!active.size) return;
  spinning=true; $('#spinBtn').disabled=true; $('#skipBtn').disabled=false;
  const extra=Math.floor(Math.random()*360);
  const target=rotation+ (5*360) + extra;
  const start=rotation, dist=target-start, dur=3400, t0=performance.now();
  function step(t){
    const p=Math.min(1,(t-t0)/dur);
    const ease=1-Math.pow(1-p,3);
    rotation=start+dist*ease;
    draw();
    if(p<1){ requestAnimationFrame(step); }
    else{
      rotation=target;
      const idx=getWinner();
      spinning=false; $('#spinBtn').disabled=false;
      showResult(idx);
    }
  }
  requestAnimationFrame(step);
}
function showResult(idx){
  lastResult=idx;
  $('#resultBox').innerHTML=`
    <div class="who">🎉 ${labels[idx]}</div>
    <div class="q">${questions[Math.floor(Math.random()*questions.length)]}</div>
    <div class="hint">請自我介紹，並回答這道題。</div>`;
  pulse($('#resultBox'));
}
function pulse(el){el.style.transition='none';el.style.transform='scale(.96)';requestAnimationFrame(()=>{el.style.transition='transform .3s';el.style.transform='scale(1)'});}
function updateDoneList(){
  const box=$('#doneList');
  const done=[...labels.keys()].filter(i=>!active.has(i));
  if(!done.length){ box.innerHTML='<span class="muted" style="font-size:13px">還沒有人介紹</span>'; return; }
  box.innerHTML=done.map(i=>`<span class="done-chip" data-i="${i}" title="點擊放回轉盤">${labels[i]} ✕</span>`).join('');
  box.querySelectorAll('.done-chip').forEach(c=>c.addEventListener('click',()=>{ active.add(Number(c.dataset.i)); draw(); updateDoneList(); }));
}
$('#spinBtn').addEventListener('click',spin);
$('#skipBtn').addEventListener('click',()=>{ if(spinning) return; spin(); });
$('#applyBtn').addEventListener('click',buildLabels);
$('#tabNum').addEventListener('click',()=>{mode='num';$('#tabNum').classList.add('active');$('#tabName').classList.remove('active');$('#numField').style.display='block';$('#nameField').style.display='none';buildLabels();});
$('#tabName').addEventListener('click',()=>{mode='name';$('#tabName').classList.add('active');$('#tabNum').classList.remove('active');$('#numField').style.display='none';$('#nameField').style.display='block';buildLabels();});
buildLabels();
</script>
</body>
</html>
