<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" role="img" aria-label="普通話四聲調值圖">
  <rect width="640" height="448" fill="#ffffff"/>

  <text x="24" y="28" font-family="PingFang HK, PingFang TC, sans-serif" font-size="14" fill="#16202c">普通話四聲調值（1 最低、5 最高）</text>

  <!-- 五度音高格線，四組各一份 -->
  <g stroke="#eee3d3" stroke-width="1">
    <line x1="150" y1="56"  x2="330" y2="56"/>
    <line x1="150" y1="74"  x2="330" y2="74"/>
    <line x1="150" y1="92"  x2="330" y2="92"/>
    <line x1="150" y1="110" x2="330" y2="110"/>
    <line x1="150" y1="128" x2="330" y2="128"/>

    <line x1="150" y1="148" x2="330" y2="148"/>
    <line x1="150" y1="166" x2="330" y2="166"/>
    <line x1="150" y1="184" x2="330" y2="184"/>
    <line x1="150" y1="202" x2="330" y2="202"/>
    <line x1="150" y1="220" x2="330" y2="220"/>

    <line x1="150" y1="240" x2="330" y2="240"/>
    <line x1="150" y1="258" x2="330" y2="258"/>
    <line x1="150" y1="276" x2="330" y2="276"/>
    <line x1="150" y1="294" x2="330" y2="294"/>
    <line x1="150" y1="312" x2="330" y2="312"/>

    <line x1="150" y1="332" x2="330" y2="332"/>
    <line x1="150" y1="350" x2="330" y2="350"/>
    <line x1="150" y1="368" x2="330" y2="368"/>
    <line x1="150" y1="386" x2="330" y2="386"/>
    <line x1="150" y1="404" x2="330" y2="404"/>
  </g>

  <!-- 一聲 55 -->
  <text x="136" y="98" text-anchor="end" font-family="PingFang HK, sans-serif" font-size="15" fill="#c2562a">陰平 55</text>
  <line x1="150" y1="56" x2="330" y2="56" stroke="#c2562a" stroke-width="5" stroke-linecap="round"/>
  <text x="348" y="82" font-family="PingFang HK, sans-serif" font-size="15" fill="#16202c">媽 mā</text>
  <text x="348" y="102" font-family="PingFang HK, sans-serif" font-size="13" fill="#7d8b9a">高而平，從頭到尾不掉</text>

  <!-- 二聲 35 -->
  <text x="136" y="190" text-anchor="end" font-family="PingFang HK, sans-serif" font-size="15" fill="#b8860b">陽平 35</text>
  <line x1="150" y1="184" x2="330" y2="148" stroke="#d9a12b" stroke-width="5" stroke-linecap="round"/>
  <text x="348" y="174" font-family="PingFang HK, sans-serif" font-size="15" fill="#16202c">麻 má</text>
  <text x="348" y="194" font-family="PingFang HK, sans-serif" font-size="13" fill="#7d8b9a">由中往上升，起點不要太高</text>

  <!-- 三聲 214 -->
  <text x="136" y="282" text-anchor="end" font-family="PingFang HK, sans-serif" font-size="15" fill="#1e6b67">上聲 214</text>
  <path d="M150 276 C 200 310, 250 312, 330 282" fill="none" stroke="#1e6b67" stroke-width="5" stroke-linecap="round"/>
  <text x="348" y="266" font-family="PingFang HK, sans-serif" font-size="15" fill="#16202c">馬 mǎ</text>
  <text x="348" y="286" font-family="PingFang HK, sans-serif" font-size="13" fill="#7d8b9a">先降後升，不是一路往下</text>

  <!-- 四聲 51 -->
  <text x="136" y="374" text-anchor="end" font-family="PingFang HK, sans-serif" font-size="15" fill="#5b7fc7">去聲 51</text>
  <line x1="150" y1="332" x2="330" y2="404" stroke="#5b7fc7" stroke-width="5" stroke-linecap="round"/>
  <text x="348" y="358" font-family="PingFang HK, sans-serif" font-size="15" fill="#16202c">罵 mà</text>
  <text x="348" y="378" font-family="PingFang HK, sans-serif" font-size="13" fill="#7d8b9a">由高直落，收得住、不拖尾</text>
</svg>
