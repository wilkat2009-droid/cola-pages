<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-label="普通話聲母發音部位示意圖">
  <rect width="640" height="470" fill="#ffffff"/>

  <text x="24" y="30" font-family="PingFang HK, PingFang TC, sans-serif" font-size="14" fill="#16202c">聲母發音部位：舌頭碰到哪裡，字音就在哪裡成形</text>

  <!-- 舌面（下方弧線，代表舌頭抬起的高度） -->
  <path d="M150 340 Q 320 150 490 340" fill="none" stroke="#e6dbc9" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- 口腔上壁（由唇到喉） -->
  <path d="M120 300 Q 320 96 520 300" fill="none" stroke="#d8c4a6" stroke-width="3"/>

  <!-- 引線 -->
  <g stroke="#c2562a" stroke-width="1.4">
    <line x1="150" y1="270" x2="150" y2="120"/>
    <line x1="250" y1="204" x2="250" y2="120"/>
    <line x1="355" y1="193" x2="355" y2="120"/>
    <line x1="465" y1="248" x2="465" y2="120"/>
    <line x1="205" y1="226" x2="205" y2="176"/>
    <line x1="300" y1="191" x2="300" y2="176"/>
    <line x1="410" y1="212" x2="410" y2="176"/>
  </g>
  <g fill="#c2562a">
    <circle cx="150" cy="270" r="5"/><circle cx="205" cy="226" r="5"/>
    <circle cx="250" cy="204" r="5"/><circle cx="300" cy="191" r="5"/>
    <circle cx="355" cy="193" r="5"/><circle cx="410" cy="212" r="5"/>
    <circle cx="465" cy="248" r="5"/>
  </g>

  <!-- 上排標籤 -->
  <g font-family="PingFang HK, sans-serif" font-size="13.5" fill="#7d8b9a" text-anchor="middle">
    <text x="150" y="94">b p m</text>
    <text x="250" y="94">z c s</text>
    <text x="355" y="94">zh ch sh r</text>
    <text x="465" y="94">g k h</text>
  </g>
  <g font-family="PingFang HK, sans-serif" font-size="14" fill="#16202c" text-anchor="middle">
    <text x="150" y="114">1 雙唇</text>
    <text x="250" y="114">3 舌尖前（齒背）</text>
    <text x="355" y="114">5 舌尖後（翹舌）</text>
    <text x="465" y="114">7 舌根（軟腭）</text>
  </g>

  <!-- 中排標籤 -->
  <g font-family="PingFang HK, sans-serif" font-size="14" fill="#16202c" text-anchor="middle">
    <text x="205" y="150">2 唇齒</text>
    <text x="300" y="150">4 舌尖中（齒齦）</text>
    <text x="410" y="150">6 舌面（硬腭）</text>
  </g>
  <g font-family="PingFang HK, sans-serif" font-size="13.5" fill="#7d8b9a" text-anchor="middle">
    <text x="205" y="170">f</text>
    <text x="300" y="170">d t n l</text>
    <text x="410" y="170">j q x</text>
  </g>

  <!-- 端點 -->
  <g font-family="PingFang HK, sans-serif" font-size="13" fill="#7d8b9a">
    <text x="110" y="318" text-anchor="end">唇</text>
    <text x="530" y="318" text-anchor="start">喉</text>
  </g>

  <text x="320" y="378" text-anchor="middle" font-family="PingFang HK, sans-serif" font-size="13" fill="#b39468">虛線＝舌頭抬起的高度，它碰到上壁的位置，就是發音部位</text>

  <!-- 提醒 -->
  <g font-family="PingFang HK, sans-serif" font-size="13.5" fill="#46586b">
    <text x="24" y="414">• 左邊的字音靠嘴唇（b p m f），右邊的靠舌根（g k h），中間的是舌尖與舌面。</text>
    <text x="24" y="442">• 發音部位錯，字就錯在根上：把翹舌音 zh ch sh 說成 z c s，就是最常見的一種。</text>
  </g>
</svg>
