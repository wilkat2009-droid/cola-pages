<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="胸腹式聯合呼吸與橫膈膜示意圖">
  <rect width="640" height="420" fill="#ffffff"/>

  <!-- 軀幹輪廓 -->
  <path d="M250 40 C 200 40, 180 90, 185 150 L 190 330 C 192 375, 240 392, 320 392 C 400 392, 448 375, 450 330 L 455 150 C 460 90, 440 40, 390 40 Z"
        fill="#fbf6ee" stroke="#e6dbc9" stroke-width="2"/>

  <!-- 胸廓 -->
  <path d="M215 120 C 200 190, 215 250, 250 268 L 390 268 C 425 250, 440 190, 425 120 Z"
        fill="#f4ebde" stroke="#d8c4a6" stroke-width="2"/>
  <text x="320" y="200" text-anchor="middle" font-family="PingFang HK, sans-serif" font-size="14" fill="#7d8b9a">胸腔</text>

  <!-- 橫膈膜 -->
  <path d="M240 300 C 275 258, 365 258, 400 300" fill="none" stroke="#c2562a" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="288" text-anchor="middle" font-family="PingFang HK, sans-serif" font-size="13.5" fill="#c2562a">橫膈膜</text>

  <!-- 腹部 -->
  <text x="320" y="360" text-anchor="middle" font-family="PingFang HK, sans-serif" font-size="14" fill="#7d8b9a">腹部（吸氣時自然向外擴張）</text>

  <!-- 吸氣箭頭 -->
  <g stroke="#1e6b67" stroke-width="2.4" fill="none" marker-end="url(#arrTeal)">
    <path d="M130 130 L200 175"/>
    <path d="M510 130 L440 175"/>
  </g>
  <text x="112" y="120" font-family="PingFang HK, sans-serif" font-size="14" fill="#1e6b67" text-anchor="middle">吸氣</text>
  <text x="528" y="120" font-family="PingFang HK, sans-serif" font-size="14" fill="#1e6b67" text-anchor="middle">吸氣</text>
  <text x="112" y="140" font-family="PingFang HK, sans-serif" font-size="12" fill="#7d8b9a" text-anchor="middle">肋間肌外開</text>
  <text x="528" y="140" font-family="PingFang HK, sans-serif" font-size="12" fill="#7d8b9a" text-anchor="middle">橫膈膜下降</text>

  <!-- 吐氣箭頭 -->
  <g stroke="#5b7fc7" stroke-width="2.4" fill="none" marker-end="url(#arrBlue)">
    <path d="M136 330 L206 362"/>
    <path d="M504 330 L434 362"/>
  </g>
  <text x="320" y="410" text-anchor="middle" font-family="PingFang HK, sans-serif" font-size="13" fill="#7d8b9a">吐氣：腹部緩慢收回，氣流均勻送出，不要一下子洩掉</text>

  <!-- 肩線提醒 -->
  <path d="M195 96 L445 96" stroke="#e6dbc9" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="320" y="88" text-anchor="middle" font-family="PingFang HK, sans-serif" font-size="13" fill="#a97a4a">肩膀這一條線，吸氣時不應該抬起來</text>

  <defs>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e6b67"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7fc7"/>
    </marker>
  </defs>
</svg>
