<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VCH2101 第7課 自學闖關</title>
<style>
:root{--ink:#1e2a3d;--ink2:#31415c;--line:#d8dee9;--paper:#f6f7f9;--ok:#1d7a4d;--no:#b8471c}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font:16px/1.65 -apple-system,"PingFang HK","Microsoft JhengHei",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 0 40px}
header{background:var(--ink);color:#fff;padding:18px 18px 16px}
header .k{font-size:12px;letter-spacing:.12em;opacity:.8}
header h1{margin:2px 0 6px;font-size:21px;line-height:1.35}
header p{margin:0;font-size:13px;opacity:.82}
.bar{height:6px;background:#00000000;border-radius:9px;overflow:hidden;
 border:1px solid #ffffff40;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:#8fd6a9;transition:width .25s}
main{padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;
 box-shadow:0 1px 2px #1e2a3d0d}
.meta{display:flex;justify-content:space-between;font-size:13px;color:#5a6a80;margin-bottom:8px}
.q{font-size:18px;line-height:1.6;margin:0 0 14px;font-weight:600}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;background:#fff;
 color:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;
 margin:9px 0;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--ink2);background:#f3f5f8}
.opt:disabled{cursor:default;opacity:1}
.opt .n{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;
 border-radius:7px;background:#eef1f5;color:#4b5c74;font-size:13px;margin-right:9px;font-weight:700}
.opt.ok{border-color:var(--ok);background:#eaf7ef}
.opt.ok .n{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--no);background:#fdeee7}
.opt.bad .n{background:var(--no);color:#fff}
.opt.dim{color:#9aa6b6}
.fb{margin:14px 0 0;padding:13px 14px;border-radius:11px;background:#f1f5fb;
 border-left:4px solid var(--ink2);font-size:15.5px;display:none}
.fb.show{display:block}
.fb b{color:var(--ok)}
.fb .why{margin:0 0 6px}
.fb .tip{margin:0;font-size:14px;color:#5a6a80}
.fb .tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:20px;
 margin-bottom:8px;color:#fff}
.tag.g{background:var(--ok)}
.tag.r{background:var(--no)}
.next{display:none;width:100%;margin-top:14px;font:inherit;font-size:17px;font-weight:700;
 background:var(--ink);color:#fff;border:0;border-radius:11px;padding:14px;cursor:pointer}
.next.show{display:block}
.foot{margin:14px 4px 0;font-size:13px;color:#7183a0;text-align:center}
.foot a{color:#3f5a86}
/* 結果 */
.end{display:none}
.end.show{display:block}
.score{font-size:44px;font-weight:800;text-align:center;margin:6px 0 0}
.score small{font-size:17px;font-weight:600;color:#7183a0}
.sticker{display:block;width:150px;margin:12px auto 6px}
.verdict{text-align:center;font-size:17px;font-weight:700;margin:0 0 4px}
.sub{text-align:center;font-size:14.5px;color:#5a6a80;margin:0 18px 16px}
.again{width:100%;font:inherit;font-size:17px;font-weight:700;background:#fff;color:var(--ink);
 border:1.5px solid var(--ink);border-radius:11px;padding:13px;cursor:pointer}
.home{display:block;text-align:center;margin-top:12px;font-size:14px;color:#3f5a86}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="k">VCH2101 · 自學闖關</div>
  <h1>第7課　初來乍到・打招呼</h1>
  <p>共 14 題・答完即知對錯，每題都有解說</p>
  <div class="bar"><i id="pbar"></i></div>
</header>

<main>
  <div class="card" id="quiz">
    <div class="meta"><span id="cnt">第 1 題／14</span><span>已答對 <b id="hit">0</b> 題</span></div>
    <p class="q" id="q"></p>
    <div id="opts"></div>
    <div class="fb" id="fb"><span class="tag" id="fbtag"></span>
      <p class="why" id="why"></p><p class="tip" id="tip"></p></div>
    <button class="next" id="next">下一題 →</button>
  </div>

  <div class="card end" id="end">
    <div class="score"><span id="score">0</span> <small>/ 14</small></div>
    <img class="sticker" id="st" alt="">
    <p class="verdict" id="vd"></p>
    <p class="sub" id="sb"></p>
    <button class="again" id="again">再玩一次</button>
    <a class="home" href="https://wilkat2009-droid.github.io/cola-pages/vch2101/">← 回課堂入口</a>
  </div>

  <p class="foot">第7課自學版・手機可玩・不用登入<br>
  <a href="https://wilkat2009-droid.github.io/cola-pages/vch2101/">課堂入口</a></p>
</main>
</div>

<script>
const Q = [{"question": "甲：「您好！很高興認識您。」下列哪一句最可能是對方接著說的話？", "time": 20000, "choices": [{"answer": "「您好！請問您貴姓？」", "correct": true}, {"answer": "「吃了嗎？」", "correct": false}, {"answer": "「改天再找你吃飯。」", "correct": false}, {"answer": "「別煩我，找別人吧。」", "correct": false}]}, {"question": "甲：「早上好！幾天沒見，怎麼了？」乙：「沒什麼，謝謝關心。」這段對話屬哪種情景？", "time": 20000, "choices": [{"answer": "初次見面", "correct": false}, {"answer": "轉達問候", "correct": false}, {"answer": "請求幫忙", "correct": false}, {"answer": "熟人問候", "correct": true}]}, {"question": "甲：「好久沒見，大伙要我向你問好。」這屬於哪種打招呼情況？", "time": 20000, "choices": [{"answer": "熟人問候", "correct": false}, {"answer": "約吃飯", "correct": false}, {"answer": "轉達問候", "correct": true}, {"answer": "初次見面", "correct": false}]}, {"question": "甲：「你好！近來工作順利嗎？」乙：「托福！還好！」乙想表達什麼？", "time": 20000, "choices": [{"answer": "不清楚對方的意思", "correct": false}, {"answer": "近況不錯，多謝對方關心", "correct": true}, {"answer": "工作不順，想換工作", "correct": false}, {"answer": "現在很忙，別再打擾", "correct": false}]}, {"question": "同事早上見面問「吃了嗎？」，這句普通話的真正作用是？", "time": 20000, "choices": [{"answer": "只是打招呼，不是真的要請你吃飯", "correct": true}, {"answer": "要請你一起吃早餐", "correct": false}, {"answer": "問你有沒有吃早餐的收據", "correct": false}, {"answer": "叫你快去吃飯再回來", "correct": false}]}, {"question": "「鐘小姐，久仰久仰，見到您很高興。」這句話最適用於哪個場合？", "time": 20000, "choices": [{"answer": "很熟的老朋友開玩笑", "correct": false}, {"answer": "催對方盡快回覆", "correct": false}, {"answer": "向對方借錢前的客套", "correct": false}, {"answer": "初次見面，表示早聽過對方名號", "correct": true}]}, {"question": "自我介紹時說「我姓張，弓長張」，為什麼要把「張」拆開講？", "time": 20000, "choices": [{"answer": "表示自己的名字很特別", "correct": false}, {"answer": "這是必須的姓氏規則", "correct": false}, {"answer": "讓對方聽清楚是哪一個「張」字", "correct": true}, {"answer": "因為普通話不能讀「張」", "correct": false}]}, {"question": "「你好，我姓王，三横王，旭日的旭。」說話人提「旭日的旭」是在做什麼？", "time": 20000, "choices": [{"answer": "請對方幫他寫一遍", "correct": false}, {"answer": "用常見詞語說清楚自己的名字用哪個字", "correct": true}, {"answer": "誇自己的名字有學問", "correct": false}, {"answer": "表明自己和「旭」字有关系", "correct": false}]}, {"question": "「天水圍遠是遠了點兒，可環境清靜。」說話人的重點是什麼？", "time": 20000, "choices": [{"answer": "抱怨公司沒有交通津貼", "correct": false}, {"answer": "地方雖然遠，但環境清靜是好處", "correct": true}, {"answer": "天水圍太遠，不適合上班", "correct": false}, {"answer": "希望盡快調離這個地點", "correct": false}]}, {"question": "「瞧您這記性，連我都不認識了？」這句話的語氣是什麼？", "time": 20000, "choices": [{"answer": "半開玩笑地埋怨對方記性差", "correct": true}, {"answer": "認真批評對方失憶", "correct": false}, {"answer": "客气地自我介紹", "correct": false}, {"answer": "嚴詞拒絕往來", "correct": false}]}, {"question": "同事說「幾年不見，您可發福了！」「發福」在這裡是什麼意思？", "time": 20000, "choices": [{"answer": "祝賀對方升職", "correct": false}, {"answer": "說對方運氣變好", "correct": false}, {"answer": "說對方變得更年輕", "correct": false}, {"answer": "委婉地說對方胖了一點", "correct": true}]}, {"question": "「他是留美回來的海歸，電腦專家」「海歸」指的是什麼人？", "time": 20000, "choices": [{"answer": "在海上工作的人", "correct": false}, {"answer": "專門研究海洋的人", "correct": false}, {"answer": "長期出差海外的人", "correct": false}, {"answer": "在國外留學後回國工作的人", "correct": true}]}, {"question": "「出納部的人都不是省油的燈」中，「不是省油的燈」是什麼意思？", "time": 20000, "choices": [{"answer": "指這個人很無聊", "correct": false}, {"answer": "指某人麻煩、不好應付，惹不得", "correct": true}, {"answer": "指那裏燈光太暗", "correct": false}, {"answer": "指對方很省錢", "correct": false}]}, {"question": "做聆聽簡答題前，課本建議先花半分鐘做什麼？", "time": 20000, "choices": [{"answer": "先把答案抄在題目旁", "correct": false}, {"answer": "把錄音的每個字都寫下來", "correct": false}, {"answer": "先跟同桌對一遍答案", "correct": false}, {"answer": "先看題目，知道要聽什麼", "correct": true}]}];
const EX = [{"why": "「很高興認識您」是初次見面的客套，接著自然互問姓名；其餘幾句都要有交情或已鬧翻。", "tip": "「貴姓」是問對方姓，答「我姓張」。"}, {"why": "「幾天沒見」說明二人早已認識，乙只道謝不求助，屬熟人見面寒暄，不是第一次見。", "tip": "有「幾天沒見」就不是初次見面。"}, {"why": "「大伙要我向你問好」是替第三者帶話，說話人只是傳話，所以屬轉達問候。", "tip": "見「代我／要我向你問好」即轉達。"}, {"why": "「托福」是客套語，等於「托您的福」，表示一切還好並感謝對方關心，並非訴苦。", "tip": "「托福」＝托你的福，是客氣話。"}, {"why": "「吃了嗎」在普通話是寒暄語，作用等於「你好」，不是真的邀約或問收據。", "tip": "粵語「食咗飯未」同樣只是打招呼。"}, {"why": "「久仰」表示早已聽過對方名聲，用於初次見面、對長輩或同行客套，熟朋友不會這樣說。", "tip": "「久仰」只對初次見面的人說。"}, {"why": "同音姓氏多（張、章），拆成「弓長」能讓對方知道寫哪個字，不是規則也不是炫耀。", "tip": "粵語也講「弓長張」，作用相同。"}, {"why": "「三橫王」「旭日的旭」都是借常見字詞說明寫法，避免同音字混淆，並非請人代寫。", "tip": "普通話同音字多，報名常用拆字法。"}, {"why": "「遠是遠了點兒，可……」是轉折句，「可」後面才是重點，即環境清靜這個好處。", "tip": "「A是A，可……」重點在「可」之後。"}, {"why": "「瞧您這記性」用調侃口吻，語氣輕鬆，屬半開玩笑地埋怨，不是認真指責失憶。", "tip": "「瞧您這……」多帶調侃，非真責罵。"}, {"why": "「發福」是客氣話，實際指人胖了，用於久別重逢，並無祝賀升職之意。", "tip": "「發福」＝胖了，屬委婉說法。"}, {"why": "「海歸」是「海外歸來」的諧音簡稱，指留學外國後回國工作的人，與海洋無關。", "tip": "「海歸」諧音「海龜」，指留學回國者。"}, {"why": "「不是省油的燈」比喻人厲害、難對付，這裡指出納部的人不好惹，所以不肯去。", "tip": "此語指難應付的人，帶幾分忌憚。"}, {"why": "先看題目可預知要聽的重點，聽錄音時才知哪裡要記，不必忙著抄每個字。", "tip": "半分鐘審題，邊聽邊抓關鍵詞。"}];
const ST = 'https://wilkat2009-droid.github.io/cola-pages/vch2101/blue-stickers/';
let i = 0, hit = 0;

const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);}

function draw(){
  const q = Q[i], ex = EX[i] || {};
  $('cnt').textContent = '第 ' + (i+1) + ' 題／' + Q.length;
  $('hit').textContent = hit;
  $('q').textContent = q.question;
  const box = $('opts'); box.innerHTML = '';
  q.choices.forEach((c, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="n">' + 'ABCD'[k] + '</span>' + esc(c.answer);
    b.onclick = () => pick(k, c.correct === true);
    box.appendChild(b);
  });
  $('fb').className = 'fb';
  $('next').className = 'next';
  $('next').textContent = (i === Q.length - 1) ? '看結果 →' : '下一題 →';
}

function pick(k, ok){
  const q = Q[i], ex = EX[i] || {};
  const btns = [...document.querySelectorAll('.opt')];
  const right = q.choices.findIndex(c => c.correct === true);
  btns.forEach((b, j) => {
    b.disabled = true;
    if (j === right) b.classList.add('ok');
    else if (j === k) b.classList.add('bad');
    else b.classList.add('dim');
  });
  if (ok) hit++;
  $('hit').textContent = hit;
  const tag = $('fbtag');
  tag.className = 'tag ' + (ok ? 'g' : 'r');
  tag.textContent = ok ? '答對了' : '再看一次';
  $('why').innerHTML = ex.why ? esc(ex.why) : ('正解：' + esc(q.choices[right].answer));
  $('tip').textContent = ex.tip || '';
  $('fb').className = 'fb show';
  $('next').className = 'next show';
}

$('next').onclick = () => {
  i++;
  if (i >= Q.length) return finish();
  draw();
  window.scrollTo({top: 0, behavior: 'smooth'});
};

function finish(){
  $('quiz').style.display = 'none';
  $('end').className = 'card end show';
  const n = Q.length, pct = hit / n;
  $('score').textContent = hit;
  let img, vd, sb;
  if (hit === n) { img = ST + 'love-encouragement.webp'; vd = '滿分！全對。';
    sb = '這一課的字你都認得了，去下一課吧。'; }
  else if (pct >= 0.8) { img = ST + 'star-smile.webp'; vd = '好叻！只差一點點。';
    sb = '錯的那幾題再讀一次解說，然後再玩一次就全對了。'; }
  else if (pct >= 0.6) { img = ST + 'thumbs-up.webp'; vd = '合格，但未穩。';
    sb = '把答錯的題目對應的課文段落再看一遍，再玩一次。'; }
  else { img = ST + 'smile-soft.webp'; vd = '先別灰心，這課要再讀一次。';
    sb = '打開課本的學生版，邊聽音頻邊看，然後回來再玩一次。'; }
  $('st').src = img; $('st').alt = '';
  $('vd').textContent = vd; $('sb').textContent = sb;
  $('pbar').style.width = '100%';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

$('again').onclick = () => {
  i = 0; hit = 0;
  $('end').className = 'card end';
  $('quiz').style.display = 'block';
  $('pbar').style.width = '0';
  draw();
  window.scrollTo({top: 0});
};

draw();
</script>
</body>
</html>
