<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VCH2101 第8課 自學闖關</title>
<style>
:root{--ink:#1e2a3d;--ink2:#31415c;--line:#d8dee9;--paper:#f6f7f9;--ok:#1d7a4d;--no:#b8471c}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font:16px/1.65 -apple-system,"PingFang HK","Microsoft JhengHei",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 0 40px}
header{background:var(--ink);color:#fff;padding:18px 18px 16px}
header .k{font-size:12px;letter-spacing:.12em;opacity:.8}
header h1{margin:2px 0 6px;font-size:21px;line-height:1.35}
header p{margin:0;font-size:13px;opacity:.82}
.bar{height:6px;background:#00000000;border-radius:9px;overflow:hidden;
 border:1px solid #ffffff40;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:#8fd6a9;transition:width .25s}
main{padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;
 box-shadow:0 1px 2px #1e2a3d0d}
.meta{display:flex;justify-content:space-between;font-size:13px;color:#5a6a80;margin-bottom:8px}
.q{font-size:18px;line-height:1.6;margin:0 0 14px;font-weight:600}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;background:#fff;
 color:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;
 margin:9px 0;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--ink2);background:#f3f5f8}
.opt:disabled{cursor:default;opacity:1}
.opt .n{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;
 border-radius:7px;background:#eef1f5;color:#4b5c74;font-size:13px;margin-right:9px;font-weight:700}
.opt.ok{border-color:var(--ok);background:#eaf7ef}
.opt.ok .n{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--no);background:#fdeee7}
.opt.bad .n{background:var(--no);color:#fff}
.opt.dim{color:#9aa6b6}
.fb{margin:14px 0 0;padding:13px 14px;border-radius:11px;background:#f1f5fb;
 border-left:4px solid var(--ink2);font-size:15.5px;display:none}
.fb.show{display:block}
.fb b{color:var(--ok)}
.fb .why{margin:0 0 6px}
.fb .tip{margin:0;font-size:14px;color:#5a6a80}
.fb .tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:20px;
 margin-bottom:8px;color:#fff}
.tag.g{background:var(--ok)}
.tag.r{background:var(--no)}
.next{display:none;width:100%;margin-top:14px;font:inherit;font-size:17px;font-weight:700;
 background:var(--ink);color:#fff;border:0;border-radius:11px;padding:14px;cursor:pointer}
.next.show{display:block}
.foot{margin:14px 4px 0;font-size:13px;color:#7183a0;text-align:center}
.foot a{color:#3f5a86}
/* 結果 */
.end{display:none}
.end.show{display:block}
.score{font-size:44px;font-weight:800;text-align:center;margin:6px 0 0}
.score small{font-size:17px;font-weight:600;color:#7183a0}
.sticker{display:block;width:150px;margin:12px auto 6px}
.verdict{text-align:center;font-size:17px;font-weight:700;margin:0 0 4px}
.sub{text-align:center;font-size:14.5px;color:#5a6a80;margin:0 18px 16px}
.again{width:100%;font:inherit;font-size:17px;font-weight:700;background:#fff;color:var(--ink);
 border:1.5px solid var(--ink);border-radius:11px;padding:13px;cursor:pointer}
.home{display:block;text-align:center;margin-top:12px;font-size:14px;color:#3f5a86}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="k">VCH2101 · 自學闖關</div>
  <h1>第8課　工作任務</h1>
  <p>共 13 題・答完即知對錯，每題都有解說</p>
  <div class="bar"><i id="pbar"></i></div>
</header>

<main>
  <div class="card" id="quiz">
    <div class="meta"><span id="cnt">第 1 題／13</span><span>已答對 <b id="hit">0</b> 題</span></div>
    <p class="q" id="q"></p>
    <div id="opts"></div>
    <div class="fb" id="fb"><span class="tag" id="fbtag"></span>
      <p class="why" id="why"></p><p class="tip" id="tip"></p></div>
    <button class="next" id="next">下一題 →</button>
  </div>

  <div class="card end" id="end">
    <div class="score"><span id="score">0</span> <small>/ 13</small></div>
    <img class="sticker" id="st" alt="">
    <p class="verdict" id="vd"></p>
    <p class="sub" id="sb"></p>
    <button class="again" id="again">再玩一次</button>
    <a class="home" href="https://wilkat2009-droid.github.io/cola-pages/vch2101/">← 回課堂入口</a>
  </div>

  <p class="foot">第8課自學版・手機可玩・不用登入<br>
  <a href="https://wilkat2009-droid.github.io/cola-pages/vch2101/">課堂入口</a></p>
</main>
</div>

<script>
const Q = [{"question": "課文「粵普對譯」中，「捱夜」的普通話說法是甚麼？", "time": 10000, "choices": [{"answer": "熬夜", "correct": true}, {"answer": "值班", "correct": false}, {"answer": "早睡", "correct": false}, {"answer": "加班", "correct": false}]}, {"question": "「當值」的普通話說法是甚麼？", "time": 10000, "choices": [{"answer": "值班", "correct": true}, {"answer": "放假", "correct": false}, {"answer": "開會", "correct": false}, {"answer": "加班", "correct": false}]}, {"question": "工作會議上負責做紀錄的人，他的職位是甚麼？", "time": 10000, "choices": [{"answer": "會計", "correct": false}, {"answer": "秘書", "correct": true}, {"answer": "工程師", "correct": false}, {"answer": "經理", "correct": false}]}, {"question": "經理叫小鵬「趕緊」把缺的、壞的補一下，「趕緊」是甚麼意思？", "time": 10000, "choices": [{"answer": "快一點", "correct": true}, {"answer": "不用做", "correct": false}, {"answer": "慢慢來", "correct": false}, {"answer": "慢一點", "correct": false}]}, {"question": "陳主任說，今天會議的主要任務是講解哪個月的工作分配情況？", "time": 10000, "choices": [{"answer": "十一月份", "correct": false}, {"answer": "十二月份", "correct": false}, {"answer": "九月份", "correct": false}, {"answer": "十月份", "correct": true}]}, {"question": "小鄭負責裕發公司的甚麼項目？", "time": 10000, "choices": [{"answer": "電子保安系統", "correct": false}, {"answer": "軟件安裝", "correct": true}, {"answer": "產品設計", "correct": false}, {"answer": "空調維修", "correct": false}]}, {"question": "小郭負責維修哪座大廈？", "time": 10000, "choices": [{"answer": "天行大廈", "correct": false}, {"answer": "萬里大廈", "correct": false}, {"answer": "長興工業大廈", "correct": false}, {"answer": "長城大廈", "correct": true}]}, {"question": "黃經理要求鋼釘必須是哪裡製造的？", "time": 10000, "choices": [{"answer": "法國", "correct": false}, {"answer": "美國", "correct": false}, {"answer": "日本", "correct": false}, {"answer": "德國", "correct": true}]}, {"question": "原本的送貨日期是8月19日，黃經理要求提早五天，即改為幾月幾日？", "time": 10000, "choices": [{"answer": "8月14日", "correct": true}, {"answer": "8月19日", "correct": false}, {"answer": "8月9日", "correct": false}, {"answer": "8月24日", "correct": false}]}, {"question": "為趕進度，黃經理要求把貨直接送到哪裡？", "time": 10000, "choices": [{"answer": "總公司", "correct": false}, {"answer": "陳經理的辦公室", "correct": false}, {"answer": "工廠", "correct": true}, {"answer": "沙田分店", "correct": false}]}, {"question": "從銷售情況看，哪類潤膚產品的銷售量增加較快？", "time": 10000, "choices": [{"answer": "防曬的", "correct": false}, {"answer": "抗皺的", "correct": false}, {"answer": "具有保濕補水功效的", "correct": true}, {"answer": "美白潤膚的", "correct": false}]}, {"question": "乙說「反正再努力也買不起房，還不如趁早躺平」，他對加班的態度是怎樣的？", "time": 20000, "choices": [{"answer": "認為加班可以買房", "correct": false}, {"answer": "否定加班的意義，態度負面", "correct": true}, {"answer": "肯定加班，態度正面", "correct": false}, {"answer": "覺得加班很開心", "correct": false}]}, {"question": "陳主任說小方「還真不像話」，反映他對小方的態度是怎樣的？", "time": 20000, "choices": [{"answer": "覺得她做得很好", "correct": false}, {"answer": "很欣賞她", "correct": false}, {"answer": "很不滿，帶責備", "correct": true}, {"answer": "很同情她", "correct": false}]}];
const EX = [{"why": "粵語「捱夜」指通宵不睡，普通話說「熬夜」；「加班」是超時工作，不等於通宵。", "tip": "捱夜＝熬夜；加班是另一回事。"}, {"why": "粵語「當值」指按班次上班，普通話說「值班」；「加班」是逾時工作，意思不同。", "tip": "當值＝值班，不是加班。"}, {"why": "課文中陳主任叫周秘書把會議內容記下，負責紀錄的職位就是秘書，其他職位不管紀錄。", "tip": "秘書的職務包括紀錄和發會議紀錄。"}, {"why": "「趕緊」表示要抓緊時間、立刻去做，等於「快一點」，與「慢慢來」相反。", "tip": "趕緊／趕快＝快點，粵語「快啲」。"}, {"why": "陳主任開場說明當天會議主要講解十月份的工作分配，並非九月或十一、十二月。", "tip": "十一點是散會時間，別當成月份。"}, {"why": "課文說小鄭「是管軟件的」，負責裕發公司的軟件安裝，電子保安系統由小朱負責。", "tip": "小鄭＝軟件安裝；小朱＝電子保安系統。"}, {"why": "小郭匯報維修長城大廈的工程已展開；長興工業大廈只是另一情景出現的地址。", "tip": "長城≠長興，留意大廈名相近的陷阱。"}, {"why": "黃經理特別叮囑「鋼釘要德國製造的」，日本只是技術人員深造的地方。", "tip": "聽到的國家若是「深造／留學」，別當成產地。"}, {"why": "8月19日提早五天，往前推五日即8月14日；8月24日是延後，不是提早。", "tip": "「提早」要往前減，不是加。"}, {"why": "黃經理說為趕進度，改為把貨直接送到工廠，不再送總公司，沙田只是廠址所在。", "tip": "送貨點由總公司改為工廠。"}, {"why": "韓經理說銷售額穩定的是美白潤膚產品，增加較快的是保濕補水類，兩者要分清。", "tip": "「穩定」與「增加較快」分屬兩類產品。"}, {"why": "「還不如趁早躺平」表示再努力也沒用，故否定加班的意義，態度消極負面。", "tip": "躺平＝放棄拼搏，屬負面態度。"}, {"why": "「不像話」指行為不合情理，陳主任怪小方開會還在電話裡說三道四，明顯不滿。", "tip": "「不像話」＝離譜，帶責備。"}];
const ST = 'https://wilkat2009-droid.github.io/cola-pages/vch2101/blue-stickers/';
let i = 0, hit = 0;

const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);}

function draw(){
  const q = Q[i], ex = EX[i] || {};
  $('cnt').textContent = '第 ' + (i+1) + ' 題／' + Q.length;
  $('hit').textContent = hit;
  $('q').textContent = q.question;
  const box = $('opts'); box.innerHTML = '';
  q.choices.forEach((c, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="n">' + 'ABCD'[k] + '</span>' + esc(c.answer);
    b.onclick = () => pick(k, c.correct === true);
    box.appendChild(b);
  });
  $('fb').className = 'fb';
  $('next').className = 'next';
  $('next').textContent = (i === Q.length - 1) ? '看結果 →' : '下一題 →';
}

function pick(k, ok){
  const q = Q[i], ex = EX[i] || {};
  const btns = [...document.querySelectorAll('.opt')];
  const right = q.choices.findIndex(c => c.correct === true);
  btns.forEach((b, j) => {
    b.disabled = true;
    if (j === right) b.classList.add('ok');
    else if (j === k) b.classList.add('bad');
    else b.classList.add('dim');
  });
  if (ok) hit++;
  $('hit').textContent = hit;
  const tag = $('fbtag');
  tag.className = 'tag ' + (ok ? 'g' : 'r');
  tag.textContent = ok ? '答對了' : '再看一次';
  $('why').innerHTML = ex.why ? esc(ex.why) : ('正解：' + esc(q.choices[right].answer));
  $('tip').textContent = ex.tip || '';
  $('fb').className = 'fb show';
  $('next').className = 'next show';
}

$('next').onclick = () => {
  i++;
  if (i >= Q.length) return finish();
  draw();
  window.scrollTo({top: 0, behavior: 'smooth'});
};

function finish(){
  $('quiz').style.display = 'none';
  $('end').className = 'card end show';
  const n = Q.length, pct = hit / n;
  $('score').textContent = hit;
  let img, vd, sb;
  if (hit === n) { img = ST + 'love-encouragement.webp'; vd = '滿分！全對。';
    sb = '這一課的字你都認得了，去下一課吧。'; }
  else if (pct >= 0.8) { img = ST + 'star-smile.webp'; vd = '好叻！只差一點點。';
    sb = '錯的那幾題再讀一次解說，然後再玩一次就全對了。'; }
  else if (pct >= 0.6) { img = ST + 'thumbs-up.webp'; vd = '合格，但未穩。';
    sb = '把答錯的題目對應的課文段落再看一遍，再玩一次。'; }
  else { img = ST + 'smile-soft.webp'; vd = '先別灰心，這課要再讀一次。';
    sb = '打開課本的學生版，邊聽音頻邊看，然後回來再玩一次。'; }
  $('st').src = img; $('st').alt = '';
  $('vd').textContent = vd; $('sb').textContent = sb;
  $('pbar').style.width = '100%';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

$('again').onclick = () => {
  i = 0; hit = 0;
  $('end').className = 'card end';
  $('quiz').style.display = 'block';
  $('pbar').style.width = '0';
  draw();
  window.scrollTo({top: 0});
};

draw();
</script>
</body>
</html>
