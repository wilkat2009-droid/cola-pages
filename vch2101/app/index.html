function sentCard(){const q=SN[si%SN.length],m=sentMap(q),n=q[1].split('|').length;return `<b>成語維修 ${si%SN.length+1}/10　尚欠 ${n-sfx.length} 個未簡化的字</b><p class="muted">點出句子裡還沒簡化的字，同一個字重複出現會一起修好。修完全組讀一次，再說用了哪個偏旁。</p><div class="sentbox">${q[0].split('').map((c,i)=>`<button class="sch ${sfx.indexOf(c)>=0?'done':''}" onclick="fixChar(${i})">${sfx.indexOf(c)>=0?m[c]:c}</button>`).join('')}</div><div id="fixMsg" class="result">${sfx.length===n?'✓ 這句全部修好！完整讀一次，再講偏旁替換了什麼。':'逐個點，先想偏旁，再動手。'}</div><button class="btn" onclick="nextSent()">下一句 →</button>`}
function fixChar(i){const q=SN[si%SN.length],m=sentMap(q),f=$('fixMsg');const c=q[0].split('')[i];if(sfx.indexOf(c)>=0){f.textContent='這個已經修好了。';f.style.color='#ce6c35';return}if(m[c]){sfx.push(c);fx++;if(sfx.length===q[1].split('|').length){sd++;$('s2d').textContent=sd;$('l2box').innerHTML=sentCard();$('l2box').querySelector('#fixMsg').textContent='✓ 這句全部修好！完整讀一次，再講偏旁替換了什麼。';$('l2box').querySelector('#fixMsg').style.color='#23834a';l2mile()}else{$('l2box').innerHTML=sentCard();$('l2box').querySelector('#fixMsg').textContent='✓ '+c+' → '+m[c]+'，再找找還有哪個。';$('l2box').querySelector('#fixMsg').style.color='#23834a'}}else{f.innerHTML=`<img class="mini" src="${SK}nervous-sweat.webp" alt="">這個字不需要用偏旁類推，再找找其他的。`;f.style.color='#ce6c35'}}function nextSent(){si=(si+1)%SN.length;sfx=[];$('l2box').innerHTML=sentCard()}function fmt(){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function tick(){if($('clock'))$('clock').textContent=fmt()}function start(){clearInterval(timer);timer=setInterval(()=>{if(sec){sec--;tick()}else clearInterval(timer)},1000)}function pause(){clearInterval(timer)}function reset(){pause();sec=120;tick()}function tools(){$('main').innerHTML=`<div class="top"><div><div class="ey">VCH2101 · REAL PLAY MODE</div><h2>🧰 課堂工具箱</h2><p>這裡不是活動名稱清單，按下「開始互動」就可以直接玩。</p></div><button class="btn dark" onclick="render()">返回本課</button></div><div class="why"><b>工具箱得分：<span id="toolScore">${toolScore}</span></b>　每題答完都要用一句中文說明。</div><section class="toolbox">${[['⏱️限時找字','每組找目標字並說明理由。'],['🧩偏旁接龍','老師給偏旁，學生輪流說字。'],['⚖️字形法庭','原字方、簡化方、法官辯論。'],['🗺️路線搶救','聽指示畫路線並找漏聽。'],['🎭語氣偵探','用不同語氣說話讓同學猜。'],['📋經理派單','聽任務並覆述重點。'],['🍽️客戶不能吃什麼','抽限制卡設計菜單。'],['🧾人事櫃台輪轉','請假、入職、補辦文件輪轉。'],['🛡️安全隱患偵探','找隱患並三句報告。']].map((g,i)=>`<div class="game"><b>${g[0]}</b><p>${g[1]}</p>${i<4?`<button class="btn toolbtn" onclick="playTool(${i})">▶ 開始互動</button>`:'<span class="muted">老師帶領活動</span>'}</div>`).join('')}</section><div id="toolStage" class="card"><span class="tag green">互動遊戲區</span><h3>選一個「開始互動」</h3><p class="muted">學生按答案後，老師要求他說理由或完整句子。</p></div>`}function playTool(i){if(i===0)$('toolStage').innerHTML=`<span class="tag orange">限時找字</span><h3>請找出句子中的簡化字</h3><p>經理今天發出電腦通知。點出簡化字，並讀出繁體字。</p>${['经','理','发','电'].map(o=>`<button class="choice" onclick="findPick('${o}')">${o}</button>`).join('')}<div id="toolFeedback" class="result">目標：找出3個簡化字。</div>`;if(i===1)$('toolStage').innerHTML=`<span class="tag orange">語氣偵探</span><h3>「請坐，請多多指教。」</h3><p>初次見面最適合什麼語氣？選完要用該語氣讀一次。</p>${['熱情','客氣','不耐煩'].map(o=>`<button class="choice" onclick="tonePick('${o}')">${o}</button>`).join('')}<div id="toolFeedback" class="result">先判斷，再朗讀。</div>`;if(i===2)$('toolStage').innerHTML=`<span class="tag orange">經理派單</span><h3>「請在三點前把合同送到人事部。」</h3><p>找出工作內容、時間和地點，然後覆述一次。</p>${['工作內容','時間','地點','天氣'].map(o=>`<button class="choice" onclick="dispatchPick('${o}')">${o}</button>`).join('')}<div id="toolFeedback" class="result">找出三個關鍵資料。</div>`;if(i===3){routePos=0;$('toolStage').innerHTML=`<span class="tag orange">路線搶救</span><h3>按正確次序完成外勤路線</h3><p>先到荃灣送貨，然後中環取樣品，再到大埔接待客人。</p>${['荃灣','中環','大埔'].map(o=>`<button class="choice" onclick="routePick('${o}')">${o}</button>`).join('')}<div id="toolFeedback" class="result">第一站是哪裡？</div>`}}function findPick(v){const f=$('toolFeedback');if(['经','发','电'].includes(v)){toolScore++;f.textContent='✓ 找到！請說出「'+v+'」的繁體字。';f.style.color='#23834a'}else{f.textContent='再看字形，這個字沒有簡化。';f.style.color='#ce6c35'}$('toolScore').textContent=toolScore}function tonePick(v){const f=$('toolFeedback');if(v==='客氣'){toolScore++;f.textContent='✓ 正確！請用客氣語氣朗讀。';f.style.color='#23834a'}else{f.textContent='初次見面要有禮貌，再試一次。';f.style.color='#ce6c35'}$('toolScore').textContent=toolScore}function dispatchPick(v){const f=$('toolFeedback');if(['工作內容','時間','地點'].includes(v)){toolScore++;f.textContent='✓ 關鍵資料！請覆述：我會在三點前把合同送到人事部。';f.style.color='#23834a'}else{f.textContent='這不是任務的必要資料。';f.style.color='#ce6c35'}$('toolScore').textContent=toolScore}function routePick(v){const r=['荃灣','中環','大埔'],f=$('toolFeedback');if(v===r[routePos]){routePos++;toolScore++;f.textContent=routePos===3?'✓ 路線完成！請完整報告一次。':'✓ 正確，下一站？';f.style.color='#23834a'}else{f.textContent='次序不對，再聽一次。';f.style.color='#ce6c35'}$('toolScore').textContent=toolScore}function guide(){$('main').innerHTML=`<div class="top"><div><div class="ey">VCH2101 · QUICK GUIDE</div><h2>📖 使用說明</h2><p>手機打開這個固定入口後，照下面幾步就可以上課。</p></div><button class="btn dark" onclick="home()">返回課程</button></div><div class="card"><span class="tag orange">固定入口</span><h3>只需要記住一個網址</h3><p>把目前這個網址加入書籤，或寄到自己的 email。之後內容會更新，但入口不變。</p><p><b>手機顯示舊版本：</b>關閉頁面後重新打開；仍未更新時再重新整理。</p></div><div class="card"><span class="tag green">學生上課四步</span><h3>OneDrive ＋ 網頁</h3><ol><li>OneDrive 打開正式 PDF 或音頻。</li><li>網頁選今天的課次和學習目標。</li><li>選 1–2 個「目標對齊互動包」，或打開工具箱。</li><li>學生最後要說、寫、朗讀或匯報。</li></ol></div><div class="card"><span class="tag green">活動卡怎麼玩</span><h3>每一課的三個活動都有「▶ 開玩」</h3><p>按下去跳出全螢幕執行面板：四步流程、3／5／8 分鐘倒數、四組加分、學生輸出核對清單（點一下打勾）。老師照著唸、按開始、給分，學生就有事做。</p><p class="muted">這一層是課堂操作台，不是刷題遊戲；有 \ud83c\udfae 標記的課次另外有 Kahoot，第二課還有可玩的偏旁工廠。</p></div><div class="card"><span class="tag orange">第二課</span><h3>偏旁工廠（三個小遊戲）</h3><p>點「偏旁類推法」→ ① 偏旁\u63c0字（找出已簡化的字）→ ② 類推陷阱（判斷可否類推）→ ③ 成語維修站（點出句子裡未簡化的字）。每題都要學生說一句：</p><div class="teacher">這個字用了哪個簡化偏旁？為什麼可以／不可以直接類推？</div></div><div class="card"><span class="tag orange">課本 PDF</span><h3>每一課都有學生版與教師版</h3><p>課次頁中間有「&#128214; 學生版 PDF」和「&#128274; 教師版（有答案）」兩個按鈕，點下去直接在網頁裡打開該課課本，不用再去 OneDrive 翻檔。教師版由 Word 原檔轉成 PDF，版面與紙本一致。</p><p class="muted">這兩個頁面放在公開網址上：學生若自己去翻連結，理論上點得到教師版答案。想只留學生版、教師版改回 OneDrive，跟我說一聲就好。</p></div><div class="card"><span class="tag green">Kahoot 闖關</span><h3>課次有 \ud83c\udfae 標記的，就有 20–24 題 Kahoot</h3><p>有 \ud83c\udfae 標記的課次都已經在她的 Kahoot 帳號裡做好；題庫清單由網頁即時載入，往後我補課次她不用重新部署就會出現；課堂上按「打開 Kahoot」→ 主持即時遊戲 → 學生輸入 PIN。答完抽一組說「我聽到／看到哪個線索」才算分。</p></div><div class="card"><span class="tag green">通關獎勵</span><h3>三關全過會跳出老師表情包</h3><p>每一關完成會先跳一個小鼓勵；① 14 題、② 8 題、③ 10 句全部完成，畫面會出現「通關完成！你們好棒！」，可以按「再玩一輪」給另一組玩。</p></div><div class="card"><span class="tag green">工具箱</span><h3>真的可以點擊玩的 4 個遊戲</h3><p>限時找字、語氣偵探、經理派單、路線搶救。每答一題後，都要求學生用一句完整中文說理由、讀答案或覆述任務。</p></div><div class="card"><span class="tag">計時器</span><h3>開始／暫停／重設</h3><p>每個小任務用 02:00 倒數。時間到就交換資料或匯報，避免學生只坐著聽。</p></div><div class="card"><span class="tag orange">教師專區</span><h3>密碼：2101</h3><p>內有兩小時打法、四人分組、音頻失效備案，以及 OneDrive 與網頁的資料分工。</p></div><div class="card"><span class="tag orange">如果遊戲點不動</span><h3>三步自查</h3><ol><li>看左邊選單有沒有「📖 使用說明」和「版本 0915E」，沒有就是舊版本，請重新整理。</li><li>如果是從 Email／WhatsApp 裡點開的，請選「在瀏覽器中開啟」，不要用 App 內建瀏覽器上課。</li><li>iPhone 到「設定 → Safari → 進階」，關掉「阻截所有 Cookie」，再重新整理頁面。</li></ol><p class="muted">舊版本在封鎖 Cookie 時會整個失靈；這一版已改成就算封鎖也能照常玩。</p></div>`}function tdesk(){$('main').innerHTML=`<div class="top"><div><div class="ey">TEACHER DESK</div><h2>\ud83d\udc69\u200d\ud83c\udfeb 教師須知</h2><p>只給老師看的上課打法。</p></div><button class="btn dark" onclick="home()">返回課程</button></div><div class="card"><span class="tag orange">固定打法</span><h3>先情境、再任務、後規則、一定輸出</h3><div class="teacher">每 15–20 分鐘換一次感官：聽錄音→看字卡→站起來排路線→小組說話→白板書寫。每課互動包選 1–2 個即可。</div></div><div class="cols"><div class="card"><h3>兩小時節奏</h3><p>情境 10 分鐘 → 教材 20 分鐘 → 任務一 25 分鐘 → 任務二 25 分鐘 → 角色扮演 25 分鐘 → 回饋 10 分鐘 → 離堂小卡 5 分鐘。</p></div><div class="card"><h3>四人分組</h3><p>經理發布任務、執行員完成、記錄員寫重點、觀察員記溝通表現。每完成一次任務就交換角色。</p></div><div class="card"><h3>音頻備案</h3><p>老師朗讀三次：抓關鍵詞、補資料、學生朗讀；課後再補正式音頻。</p></div></div><div class="card"><span class="tag green">資料分工</span><p>此網頁：每課的學生版／教師版 PDF、遊戲、角色、計時、學生輸出。OneDrive：音頻、原始 Word／PDF 檔、評核紀錄。</p><p class="muted">教師專區只是界面密碼鎖，不是銀行級安全；真正私密的資料不要放在公開網址。</p></div>`}
function teacher(){$('main').innerHTML=`<div class="top"><div><div class="ey">TEACHER DESK</div><h2>🔒 教師專區</h2><p>輸入密碼後開啟上課打法。</p></div><button class="btn dark" onclick="home()">返回課程</button></div><div class="card"><span class="tag orange">密碼</span><h3>教師專區密碼</h3><input id="tpw" class="pin" type="password" inputmode="numeric" placeholder="2101" onkeydown="if(event.key==='Enter')tpass()"><button class="btn dark" onclick="tpass()">開啟</button><div id="tpwmsg" class="result">輸入後按開啟。</div></div>`}
function tpass(){if($('tpw').value==='2101'){tdesk()}else{$('tpwmsg').textContent='密碼不正確，再試一次。';$('tpwmsg').style.color='#ce6c35'}}function home(){$('main').innerHTML=`<div class="top"><div><div class="ey">VCH2101／2101B</div><h2>🌟 職場中文任務闖關</h2><p>OneDrive 放正式教材，這個網頁讓學生動起來。</p></div><div class="actions"><button class="btn" onclick="guide()">📖 使用說明</button><button class="btn toolbtn" onclick="tools()">🧰 工具箱</button><button class="btn" onclick="go(2)">開始第二課</button></div></div><div class="why"><b>學生不能只坐著聽。</b> 每課要看得懂、聽得明、說得清，並用中文完成任務。</div><div class="cols"><div class="card"><span class="tag orange">簡化字 · 6課</span><h3>文件和字形任務</h3><p>文件偵探→偏旁工廠→漢字醫院→字形法庭→文字博物館→閱讀解密。</p></div><div class="card"><span class="tag green">普通話聆聽 · 7課</span><h3>真實職場任務</h3><p>新員工→經理派單→外勤路線→宴請客戶→制服採購→人事櫃台→安全巡查。</p></div><div class="card"><span class="tag">每課標準</span><h3>目標—玩法—輸出</h3><p>每個互動活動都寫清楚目標，以及學生最後要說、寫或完成什麼。</p></div></div><div class="card"><span class="tag green">Kahoot 闖關</span><p>凡是有 \ud83c\udfae 標記的課次，頁面上都有「\ud83c\udfae Kahoot」按鈕，按下去直接開賽。</p></div>`}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAct()});try{(new URLSearchParams(location.search).get('l')?go(cur):home());nav();khload()}catch(e){const m=document.getElementById('main');if(m)m.innerHTML='<div class="card"><h3>⚠️ 互動載入失敗</h3><p>請重新整理頁面；若仍不行，改用 Safari 或 Chrome 直接打開這個網址。</p></div>'}</script></body></html>
