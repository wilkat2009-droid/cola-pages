*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

a{color:#8fd7d2}

/* 鎖 */

#lock .ico{font-size:46px}

.cls.on small{color:#05403a}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}

<div class="top"><h1>🧰 班級百寶箱</h1><a class="lnk" href="https://wilkat2009-droid.github.io/cola-pages/vch1101/">← 回大連結</a><button class="lnk" id="lockBtn" style="display:none">🔒 上鎖</button></div>

<div id="lock">
  <div class="ico">🔒</div>
  <h2>請輸入密碼</h2>
  <p>呢頁載有學生姓名，已加密。<br>打啱密碼就見得到名單、隨機點名同分組。</p>
  <input id="pw" type="password" autocomplete="off" placeholder="密碼" autofocus>
  <button id="go">解鎖</button>
  <div id="err"></div>
</div>

<div class="wrap" id="app">
  <div class="classes" id="classes"></div>
  <div class="tabs">
    <button class="tab on" data-p="pick">🎯 隨機點名</button>
    <button class="tab" data-p="group">👥 分組</button>
    <button class="tab" data-p="list">📋 全班名單</button>
  </div>

  <div class="pane on" id="p-pick">
    <div class="big">
      <div class="nm" id="pickName">準備好</div>
      <div class="en" id="pickEn">撳下面個掣開始抽人</div>
      <div class="meta" id="pickMeta"></div>
    </div>
    <div class="row">
      <button class="btn" id="drawBtn">🎲 抽一位</button>
      <button class="btn ghost sm" id="resetBtn">↺ 重設（可以再抽全部）</button>
    </div>
    <div class="cnt" id="pickCnt"></div>
    <div class="drawn" id="drawn"></div>
    <div class="hint">鍵盤：<b>空格／Enter</b> 抽下一位　·　抽過嘅唔會再抽，全部抽完會提你</div>
  </div>

  <div class="pane" id="p-group">
    <div class="row">
      <label style="font-size:14px;color:#8aa6bd">每組人數
        <select class="sel" id="gsize"><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
      </label>
      <button class="btn teal sm" id="groupBtn">🔀 開始分組</button>
      <button class="btn ghost sm" id="againBtn">↻ 再洗一次</button>
      <button class="btn ghost sm" id="copyBtn">📋 複製</button>
      <button class="btn ghost sm" id="printBtn">🖨 列印</button>
    </div>
    <div class="cnt" id="groupCnt"></div>
    <div class="groups" id="groups"></div>
  </div>

  <div class="pane" id="p-list">
    <input class="search" id="q" placeholder="🔍 打中文名／英文名／班別都搵得到…">
    <table><thead><tr><th style="width:52px">#</th><th>中文名</th><th>英文名</th><th style="width:70px">班別</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</div>

const $ = s => document.querySelector(s);
const b64 = s => { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
let CLASSES = null, ci = 0, drawn = [], groupsCache = [];

async function unlock(pw){
  const te = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.s), iterations:ENC.n, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.i)}, key, b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

const store = {
  get(k, d){ try{ const v = sessionStorage.getItem('colabox_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ sessionStorage.setItem('colabox_'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ sessionStorage.removeItem('colabox_'+k); }catch(e){} }
};

function cur(){ return CLASSES[ci]; }

function renderClasses(){
  $('#classes').innerHTML = CLASSES.map((c, i) =>
    '<button class="cls' + (i === ci ? ' on' : '') + '" data-i="' + i + '">' + c.label +
    '<small>' + c.students.length + ' 人　' + c.when + '　' + c.venue + '</small></button>').join('');
  document.querySelectorAll('.cls').forEach(b => b.onclick = () => {
    ci = +b.dataset.i; drawn = []; groupsCache = [];
    renderClasses(); renderPick(); renderGroups(); renderList();
    $('#pickName').textContent = '準備好'; $('#pickEn').textContent = '撳下面個掣開始抽人';
  });
}

function renderPick(){
  const c = cur();
  $('#pickMeta').textContent = c.label + '　' + c.students.length + ' 人';
  $('#pickCnt').textContent = '已抽 ' + drawn.length + ' / ' + c.students.length;
  $('#drawn').innerHTML = drawn.map((s, i) => '<span class="pill"><b>' + (i + 1) + '</b>' + s.zh + '</span>').join('');
}

function draw(){
  const c = cur();
  if (drawn.length >= c.students.length){
    $('#pickName').textContent = '全班抽完'; $('#pickEn').textContent = '撳「重設」再來一次';
    return;
  }
  const used = new Set(drawn.map(s => s.zh + '|' + s.en));
  const pool = c.students.filter(s => !used.has(s.zh + '|' + s.en));
  const s = pool[Math.floor(Math.random() * pool.length)];
  drawn.push(s);
  $('#pickName').textContent = s.zh;
  $('#pickEn').textContent = s.en + (s.tag === 'RS' ? '　·　重讀' : '');
  renderPick();
}

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function makeGroups(){
  const size = Math.max(2, Math.min(6, +$('#gsize').value || 3));
  const c = cur();
  const arr = shuffle(c.students.slice());
  const n = Math.ceil(arr.length / size);
  const gs = Array.from({length: n}, () => []);
  arr.forEach((s, i) => gs[i % n].push(s));
  groupsCache = gs;
  $('#groupCnt').textContent = c.label + '　' + c.students.length + ' 人 → ' + n + ' 組（每組約 ' + size + ' 人）';
  $('#groups').innerHTML = gs.map((g, i) =>
    '<div class="g"><h3>第 ' + (i + 1) + ' 組（' + g.length + ' 人）</h3><ul>' +
    g.map(s => '<li>' + s.zh + '<small>' + s.en + '</small>' + (s.tag === 'RS' ? '<span class="rs">重讀</span>' : '') + '</li>').join('') +
    '</ul></div>').join('');
}

function renderGroups(){ if (groupsCache.length) makeGroups(); else { $('#groups').innerHTML = ''; $('#groupCnt').textContent = ''; } }

function renderList(){
  const c = cur(), q = ($('#q').value || '').trim().toLowerCase();
  const rows = c.students.filter(s => !q || s.zh.includes(q) || s.en.toLowerCase().includes(q) || s.k.toLowerCase().includes(q));
  $('#rows').innerHTML = rows.map((s, i) => '<tr><td class="n">' + (i + 1) + '</td><td>' + s.zh +
    (s.tag === 'RS' ? '<span class="rs">重讀</span>' : '') + '</td><td>' + s.en + '</td><td>' + s.k + '</td></tr>').join('');
}

function boot(){
  ci = store.get('ci', 0); if (ci < 0 || ci >= CLASSES.length) ci = 0;
  $('#lock').style.display = 'none';
  $('#app').style.display = 'block';
  $('#lockBtn').style.display = 'inline-block';
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + t.dataset.p));
    if (t.dataset.p === 'list') renderList();
  });
  $('#drawBtn').onclick = draw;
  $('#resetBtn').onclick = () => { drawn = []; $('#pickName').textContent = '準備好'; $('#pickEn').textContent = '撳下面個掣開始抽人'; renderPick(); };
  $('#groupBtn').onclick = makeGroups;
  $('#againBtn').onclick = makeGroups;
  $('#copyBtn').onclick = () => {
    if (!groupsCache.length) return;
    const txt = groupsCache.map((g, i) => '第' + (i + 1) + '組：' + g.map(s => s.zh).join('、')).join('\n');
    const done = () => { $('#copyBtn').textContent = '✅ 已複製'; setTimeout(() => $('#copyBtn').textContent = '📋 複製', 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, done);
    else { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
  };
  $('#printBtn').onclick = () => window.print();
  $('#q').oninput = renderList;
  $('#lockBtn').onclick = () => { store.del('pw'); location.reload(); };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if ($('#p-pick').classList.contains('on')) draw(); }
  });
  renderClasses(); renderPick(); renderList();
}

async function tryUnlock(pw, silent){
  $('#err').textContent = '';
  try {
    CLASSES = await unlock(pw);
    store.set('pw', pw);
    boot();
  } catch (e) {
    if (!silent) $('#err').textContent = '密碼唔啱，再試一次。';
    store.del('pw');
  }
}

$('#go').onclick = () => { const v = $('#pw').value.trim(); if (!v) { $('#err').textContent = '請輸入密碼'; return; } tryUnlock(v, false); };
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
const saved = store.get('pw', '');
if (saved) tryUnlock(saved, true);
</script></body></html>
