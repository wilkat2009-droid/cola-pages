const store = {
  get(k, d){ try{ const v = localStorage.getItem('colabox_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('colabox_'+k, JSON.stringify(v)); }catch(e){} }

let drawn = store.get('drawn_' + ci, []);
let groupsCache = [];

function cur(){ return CLASSES[ci]; }

function renderClasses(){
  $('#classes').innerHTML = CLASSES.map((c, i) =>
    '<button class="cls' + (i === ci ? ' on' : '') + '" data-i="' + i + '">' + c.label +
    '<small>' + c.students.length + ' 人　' + c.when + '　' + c.venue + '</small></button>').join('');
  document.querySelectorAll('.cls').forEach(b => b.onclick = () => {
    ci = +b.dataset.i; store.set('ci', ci);
    drawn = store.get('drawn_' + ci, []);
    groupsCache = []; renderClasses(); renderPick(); renderGroups(); renderList();
    $('#pickName').textContent = '準備好'; $('#pickEn').textContent = '撳下面個掣開始抽人';
  });
}

function renderPick(){
  const c = cur();

  $('#drawn').innerHTML = drawn.map((s, i) => '<span class="pill"><b>' + (i + 1) + '</b>' + s.zh + '</span>').join('');
}

  const used = new Set(drawn.map(s => s.zh + '|' + s.en));
  const pool = c.students.filter(s => !used.has(s.zh + '|' + s.en));
  const s = pool[Math.floor(Math.random() * pool.length)];
  drawn.push(s); store.set('drawn_' + ci, drawn);
  $('#pickName').textContent = s.zh;
  $('#pickEn').textContent = s.en + (s.tag === 'RS' ? '　·　重讀' : '');
  renderPick();
}

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function makeGroups(){
  const size = Math.max(2, Math.min(6, +$('#gsize').value || 3));
  const c = cur();
  const arr = shuffle(c.students.slice());
  const n = Math.ceil(arr.length / size);
  const gs = Array.from({length: n}, () => []);
  arr.forEach((s, i) => gs[i % n].push(s));
  groupsCache = gs;
  $('#groupCnt').textContent = c.label + '　' + c.students.length + ' 人 → ' + n + ' 組（每組約 ' + size + ' 人）';
  $('#groups').innerHTML = gs.map((g, i) =>
    '<div class="g"><h3>第 ' + (i + 1) + ' 組（' + g.length + ' 人）</h3><ul>' +
    g.map(s => '<li>' + s.zh + '<small>' + s.en + '</small>' + (s.tag === 'RS' ? '<span class="rs">重讀</span>' : '') + '</li>').join('') +
    '</ul></div>').join('');
}

function renderGroups(){ if (groupsCache.length) makeGroups(); else { $('#groups').innerHTML = ''; $('#groupCnt').textContent = ''; } }

function renderList(){
  const c = cur(), q = ($('#q').value || '').trim().toLowerCase();
  const rows = c.students.filter(s => !q || s.zh.includes(q) || s.en.toLowerCase().includes(q) || s.k.toLowerCase().includes(q));
  $('#rows').innerHTML = rows.map((s, i) => '<tr><td class="n">' + (i + 1) + '</td><td>' + s.zh +
    (s.tag === 'RS' ? '<span class="rs">重讀</span>' : '') + '</td><td>' + s.en + '</td><td>' + s.k + '</td></tr>').join('');
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + t.dataset.p));
  if (t.dataset.p === 'list') renderList();
});
$('#drawBtn').onclick = draw;
$('#resetBtn').onclick = () => { drawn = []; store.set('drawn_' + ci, drawn); $('#pickName').textContent = '準備好'; $('#pickEn').textContent = '撳下面個掣開始抽人'; renderPick(); };
$('#groupBtn').onclick = makeGroups;
$('#againBtn').onclick = makeGroups;
$('#copyBtn').onclick = () => {
  if (!groupsCache.length) return;
  const txt = groupsCache.map((g, i) => '第' + (i + 1) + '組：' + g.map(s => s.zh).join('、')).join('\n');
  const done = () => { $('#copyBtn').textContent = '✅ 已複製'; setTimeout(() => $('#copyBtn').textContent = '📋 複製', 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, done);
  else { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
};
$('#printBtn').onclick = () => window.print();
$('#q').oninput = renderList;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if ($('#p-pick').classList.contains('on')) draw(); }
});
renderClasses(); renderPick(); renderList();
</script></body></html>
