<html lang="zh-Hant">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你好，買單 · 課堂投影</title>
<style>
  :root{
    --ink:#2b2415; --paper:#FFFDF5;
    --yellow:#FFD93D; --orange:#F2994A; --green:#27AE60; --blue:#2D9CDB;
    --pink:#EF6BA0; --purple:#9B6BE8; --teal:#22B8A6; --sos:#E8543F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:Arial,"Kaiti TC",sans-serif;
    font-size:28px; line-height:1.35; color:var(--ink);
    min-height:100vh; overflow-x:hidden;
    background:linear-gradient(135deg,#FFF8DA 0%,#FFE8C2 34%,#E4F8DE 68%,#DDF0FF 100%);
    background-attachment:fixed;
  }
  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 18px;background:rgba(255,255,255,0.88);backdrop-filter:blur(6px);
    border-bottom:4px solid var(--orange);}
  .brand{font-weight:800;font-size:26px;color:#B4552A;white-space:nowrap;}
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;}
  .tabbtn{font:inherit;font-size:26px;font-weight:800;padding:10px 20px;border-radius:999px;
    border:3px solid #E0A24A;background:#FFF3D6;color:#7A4A12;cursor:pointer;box-shadow:0 3px 0 #E3B778;}
  .tabbtn.active{background:var(--orange);border-color:#B4611B;color:#FFFFFF;box-shadow:0 3px 0 #B4611B;}
  .stopbtn{font:inherit;font-size:24px;font-weight:800;padding:8px 16px;border-radius:999px;
    border:3px solid #B4611B;background:#EF3B2D;color:#FFFFFF;cursor:pointer;box-shadow:0 3px 0 #A51D16;}

  /* ---------- panes ---------- */
  .tabpane{display:none;padding:18px 22px 140px;}
  .tabpane.active{display:block;}

  /* ---------- teaching slides ---------- */
  .slide{display:none;}
  .slide.active{display:block;animation:pop .35s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .slide-head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin:0 0 14px;}
  .slide-title{font-size:clamp(32px,4.4vh,54px);font-weight:900;color:#8A4B14;}
  .slide-time{font-size:clamp(24px,2.6vh,32px);font-weight:800;color:#FFFFFF;background:var(--blue);
    padding:6px 18px;border-radius:999px;}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:20px;align-items:center;justify-content:center;
    padding:10px;background:rgba(255,255,255,0.82);border-top:3px solid #F0C98A;}
  .navbtn{font:inherit;font-size:30px;font-weight:900;min-width:70px;padding:6px 18px;border-radius:16px;
    border:3px solid #E0A24A;background:#FFF3D6;color:#7A4A12;cursor:pointer;box-shadow:0 3px 0 #E3B778;}
  .pageind{font-size:26px;font-weight:800;color:#8A4B14;min-width:110px;text-align:center;}

  /* sentence grid */
  .sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;}
  .sgrid.cols3{grid-template-columns:repeat(3,1fr);}
  .srow{background:rgba(255,255,255,0.9);border-radius:18px;padding:8px 18px;
    border-left:14px solid var(--c,#F2994A);display:flex;flex-direction:column;cursor:pointer;
    box-shadow:0 4px 12px rgba(120,80,20,0.08);}
  .srow .tc{font-size:clamp(32px,4.4vh,54px);font-weight:900;line-height:1.05;}
  .srow .py{font-size:clamp(26px,2.8vh,34px);color:#B4552A;font-weight:700;line-height:1.1;}
  .srow .en{font-size:clamp(24px,2.4vh,29px);color:#5b5147;line-height:1.15;}

  /* pills (measure words / numbers / homophones) */
  .subbar{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:10px;}
  .pill{background:rgba(255,255,255,0.92);border-radius:14px;padding:6px 14px;font-size:28px;line-height:1.2;
    border-bottom:6px solid var(--c,#F2994A);color:#3a2f22;cursor:pointer;}
  .pill b{font-size:32px;}
  .pill .pp{color:#8a6a3a;font-weight:700;}

  /* tone slide */
  .tonegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .tcard{background:rgba(255,255,255,0.92);border-radius:20px;padding:14px 10px;text-align:center;
    border-top:12px solid var(--c);cursor:pointer;box-shadow:0 4px 12px rgba(120,80,20,0.08);}
  .tmark{font-size:clamp(40px,5.4vh,64px);font-weight:900;color:#B4552A;line-height:1;}
  .tword{font-size:clamp(48px,6.6vh,88px);font-weight:900;line-height:1.05;}
  .tpy{font-size:clamp(30px,3.4vh,44px);color:var(--blue);font-weight:800;}
  .tlab{font-size:28px;color:#5b5147;}
  .bigsent{font-size:clamp(38px,5.6vh,76px);font-weight:900;color:#8A4B14;text-align:center;margin:16px 0 0;cursor:pointer;}
  .bigsent .pp{color:#2D9CDB;font-size:.62em;}

  /* hanzi (teaching) */
  .hzg{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .hz{background:rgba(255,255,255,0.92);border-radius:16px;padding:10px;text-align:center;
    box-shadow:0 4px 12px rgba(120,80,20,0.08);}
  .hz .ch{font-size:clamp(52px,7.4vh,92px);font-weight:900;line-height:1;}
  .hz .py{font-size:30px;color:#B4552A;font-weight:700;}
  .hz .en{font-size:28px;color:#5b5147;}

  /* stations */
  .stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
  .stcard{background:rgba(255,255,255,0.94);border-radius:18px;padding:14px 18px;border-top:12px solid var(--c);
    box-shadow:0 4px 12px rgba(120,80,20,0.08);}
  .stname{font-size:clamp(30px,3.6vh,44px);font-weight:900;}
  .sten{font-size:28px;color:#5b5147;}
  .sttasks{margin:8px 0 0;padding-left:26px;}
  .sttasks li{font-size:28px;font-weight:700;}
  .hw{background:rgba(255,255,255,0.94);border-radius:18px;padding:12px 20px;border-left:14px solid var(--green);}
  .hw ul{margin:0;padding-left:28px;}
  .hw li{font-size:30px;font-weight:700;}

  /* opening */
  .openwrap{text-align:center;padding:2vh 0;}
  .bigtitle{font-size:clamp(52px,11vh,150px);font-weight:900;color:#C05A12;line-height:1.05;}
  .brandline{font-size:clamp(28px,3.4vh,44px);font-weight:800;color:#2D9CDB;margin-top:6px;}
  .promise{font-size:clamp(34px,5.2vh,72px);font-weight:900;color:#1C7A46;margin-top:18px;}
  .standard{font-size:clamp(28px,3.6vh,48px);font-weight:800;color:#B4552A;margin-top:14px;}

  /* ---------- wheel ---------- */
  .wheelwrap{display:grid;grid-template-columns:1.12fr .88fr;gap:24px;align-items:center;max-width:1420px;margin:0 auto;}
  .wheelcol{display:flex;flex-direction:column;align-items:center;gap:16px;}
  #wheel{width:min(66vh,720px);max-width:100%;height:auto;filter:drop-shadow(0 12px 22px rgba(120,80,20,.22));}
  .spinbtn{font:inherit;font-size:40px;font-weight:900;letter-spacing:4px;padding:14px 64px;border-radius:999px;
    border:4px solid #B4551A;background:#EF7A2B;color:#FFFFFF;cursor:pointer;box-shadow:0 6px 0 #B4551A;}
  .scorebox{display:flex;align-items:center;gap:12px;font-size:38px;font-weight:900;color:#B4552A;}
  .minibtn{font:inherit;font-size:26px;font-weight:800;padding:6px 16px;border-radius:999px;border:3px solid #B4551A;
    background:#FFD93D;color:#7A4A12;cursor:pointer;box-shadow:0 3px 0 #C9A21C;}
  .minibtn.ghost{background:#FFFFFF;border-color:#E0A24A;color:#7A4A12;box-shadow:0 3px 0 #E3B778;}
  .result{background:rgba(255,255,255,0.95);border-radius:28px;padding:26px;text-align:center;
    border:8px solid var(--yellow);min-height:240px;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:8px;box-shadow:0 10px 26px rgba(120,80,20,.14);}
  .result .word{font-size:clamp(56px,9.4vh,124px);font-weight:900;color:#8A4B14;line-height:1;}
  .result .qm{font-size:clamp(70px,12vh,150px);font-weight:900;color:#F0C98A;}
  .result.pop{animation:pop .4s ease;}

  /* ---------- price ---------- */
  .pricewrap{max-width:1420px;margin:0 auto;display:grid;grid-template-columns:.62fr 1.38fr;gap:30px;align-items:center;}
  .ring{width:min(46vh,430px);max-width:100%;height:auto;display:block;margin:0 auto;}
  .pricebig{text-align:center;background:rgba(255,255,255,0.95);border-radius:28px;padding:24px;
    border:8px solid var(--green);box-shadow:0 10px 26px rgba(120,80,20,.14);}
  .numeral{font-size:clamp(96px,22vh,280px);font-weight:900;color:#C05A12;line-height:1;}
  .hanread{font-size:clamp(48px,9.4vh,140px);font-weight:900;color:#1C7A46;line-height:1.1;}
  .priceactions{grid-column:1 / -1;display:flex;justify-content:center;margin-top:8px;}
  .nextbtn{font:inherit;font-size:38px;font-weight:900;padding:14px 56px;border-radius:999px;border:4px solid #1C7A46;
    background:#27AE60;color:#FFFFFF;cursor:pointer;box-shadow:0 6px 0 #1C7A46;}

  /* ---------- hanzi game ---------- */
  .hzgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;max-width:1500px;margin:0 auto;}
  .hcard{font:inherit;color:var(--ink);background:rgba(255,255,255,0.95);border-radius:22px;border:5px dashed #C9A24A;
    padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;
    box-shadow:0 5px 14px rgba(120,80,20,.10);}
  .hcard .oracle{width:100%;max-width:min(21vh,160px);height:auto;color:#2f2a24;transition:.25s;}
  .hcard .reveal{display:none;}
  .hcard.open{border-style:solid;border-color:#27AE60;background:#FFFFFF;}
  .hcard.open .oracle{width:min(12vh,92px);opacity:.55;}
  .hcard.open .reveal{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .hchar{font-size:clamp(48px,6.2vh,84px);font-weight:900;line-height:1;}
  .hpy{font-size:32px;color:#B4552A;font-weight:800;}
  .hen{font-size:28px;color:#5b5147;}

  /* ---------- fx ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200;}
  #fx i{position:absolute;width:14px;height:14px;border-radius:3px;top:-24px;animation:fall 1.4s ease-in forwards;}
  @keyframes fall{from{transform:translateY(-30px) rotate(0);opacity:1}to{transform:translateY(106vh) rotate(720deg);opacity:.85}}
  .shake{animation:shake .5s;}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

  /* ---------- responsive ---------- */
  @media(max-width:1000px){
    .sgrid.cols3{grid-template-columns:repeat(2,1fr);}
    .tonegrid{grid-template-columns:repeat(2,1fr);}
    .hzg{grid-template-columns:repeat(3,1fr);}
    .stgrid{grid-template-columns:1fr;}
  }
  @media(max-width:900px){
    .wheelwrap{grid-template-columns:1fr;}
    .pricewrap{grid-template-columns:1fr;}
  }
  @media(max-width:760px){
    .sgrid,.sgrid.cols3{grid-template-columns:1fr;}
    .hzg{grid-template-columns:repeat(2,1fr);}
    .hzgrid{grid-template-columns:repeat(2,1fr);}
    .tonegrid{grid-template-columns:1fr 1fr;}
    .brand{font-size:22px;}
    .tabbtn{font-size:22px;padding:8px 14px;}
  }
</style>

<style>
/* 拼音字形保護：Arial 起頭，避免系統回退到 PingFang TC 使調號與字母分家 */
.py,.hpy,.mpy,.npy,.ppy,.sb-py,.tpy,.pc-py,.bk-npy,.py2,.py3,.qpy,.pyline { font-family: Arial, "Helvetica Neue", "Kaiti TC", sans-serif !important; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">語荷教育 · 《你好，買單》</div>
  <nav class="tabs">
    <button class="tabbtn active" data-tab="teach">教學</button>
    <button class="tabbtn" data-tab="wheel">轉盤</button>
    <button class="tabbtn" data-tab="price">價錢搶答</button>
    <button class="tabbtn" data-tab="hanzi">漢字猜猜看</button>
  </nav>
  <button id="stopAudio" class="stopbtn">⏹ 全部停止</button>
</header>

<main>
  <section id="tab-teach" class="tabpane active">
    <div id="slideHost"></div>
    <div class="nav">
      <button class="navbtn" data-nav="-1">◀</button>
      <span id="pageInd" class="pageind"></span>
      <button class="navbtn" data-nav="1">▶</button>
    </div>
  </section>

  <section id="tab-wheel" class="tabpane">
    <div class="wheelwrap">
      <div class="wheelcol">
        <canvas id="wheel" width="900" height="900"></canvas>
        <button id="spinBtn" class="spinbtn">SPIN</button>
        <div class="scorebox">
          <span>⭐</span><b id="wheelScore">0</b>
          <button id="starBtn" class="minibtn">＋⭐</button>
          <button id="starReset" class="minibtn ghost">重置</button>
        </div>
      </div>
      <div id="wheelResult" class="result"><div class="qm">？</div></div>
    </div>
  </section>

  <section id="tab-price" class="tabpane">
    <div class="pricewrap">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="86" fill="none" stroke="#E7EFD6" stroke-width="20"/>
        <circle id="ringProg" cx="100" cy="100" r="86" fill="none" stroke="#27AE60" stroke-width="20"
          stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="540.35" stroke-dashoffset="0"/>
      </svg>
      <div class="pricebig">
        <div id="priceNum" class="numeral">？</div>
        <div id="priceHan" class="hanread"></div>
      </div>
      <div class="priceactions"><button id="nextPrice" class="nextbtn">下一題</button></div>
    </div>
  </section>

  <section id="tab-hanzi" class="tabpane">
    <div id="hzgrid" class="hzgrid"></div>
  </section>
</main>

<div id="fx"></div>

  function confetti(){
    var box = document.getElementById('fx');
    for(var i=0;i<90;i++){
      var el = document.createElement('i');
      el.style.left = (Math.random()*100)+'vw';
      el.style.background = FXCOL[i%FXCOL.length];
      el.style.animationDelay = (Math.random()*0.25)+'s';
      el.style.borderRadius = (Math.random()<0.5?'50%':'3px');
      box.appendChild(el);
      (function(n){ setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); },1900); })(el);
    }

    { title:'開場：我只講普通話', time:'0–08', build:slideOpening },
    { title:'自救八句', time:'08–22', build:function(){ return slideSentences('sos',{cols:3}); } },
    { title:'四聲體操', time:'22–40', build:slideTones },
    { title:'漢字猜猜看 ＋ 中文名命名儀式', time:'40–55', build:slideHanzi },
    { title:'場景一 · 食', time:'55–75', build:function(){ return slideSentences('food',{cols:3,measures:true}); } },
    { title:'場景二 · 行', time:'75–90', build:function(){ return slideSentences('travel'); } },
    { title:'場景三 · 交朋友 ＋ 價錢搶答', time:'90–105', build:function(){ return slideSentences('social',{cols:3,numbers:true}); } },
    { title:'闖關實戰 ＋ 收尾', time:'105–120', build:slideStations }
  ];
  var slideIdx = 0;
  function buildTeach(){
    var host = document.getElementById('slideHost');
    host.innerHTML = slideDefs.map(function(d,i){
      return '<section class="slide" data-i="'+i+'">'
        + '<div class="slide-head"><div class="slide-title">'+d.title+'</div><div class="slide-time">'+d.time+'</div></div>'
        + '<div class="slide-body">'+d.build()+'</div></section>';
    }).join('');
  }
  function setSlide(i){
    slideIdx = (i%slideDefs.length + slideDefs.length) % slideDefs.length;
    $$('#slideHost .slide').forEach(function(s){ s.classList.toggle('active', +s.dataset.i===slideIdx); });
    var ind = document.getElementById('pageInd');
    if(ind) ind.textContent = (slideIdx+1) + ' / ' + slideDefs.length;
  }
  function nextSlide(d){ setSlide(slideIdx + d); }
  $$('.navbtn').forEach(function(b){ b.addEventListener('click', function(){ nextSlide(+b.dataset.nav); }); });

  /* ---------- wheel ---------- */
  var WHEEL = [
    { w:'買單', a:'F4.mp3', c:'#FFD93D' },
    { w:'不要辣', a:'F2.mp3', c:'#F2994A' },
    { w:'多少錢', a:'F7.mp3', c:'#27AE60' },
    { w:'打包', a:'F5.mp3', c:'#2D9CDB' },
    { w:'我要去', a:'T1.mp3', c:'#EF6BA0' },
    { w:'太遠了', a:'T3.mp3', c:'#9B6BE8' },
    { w:'加我微信', a:'P6.mp3', c:'#22B8A6' },
    { w:'不好意思', a:'S3.mp3', c:'#EF3B2D' }
  ];
  var rot = 0, spinning = false, hasSpun = false;
  function drawWheel(){
    var cv = document.getElementById('wheel'); if(!cv) return;
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    var cx = W/2, cy = H/2, r = Math.min(cx,cy) - 16;
    var n = WHEEL.length, seg = 2*Math.PI/n;
    for(var i=0;i<n;i++){
      var a0 = rot + i*seg, a1 = a0 + seg;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
      ctx.fillStyle = WHEEL[i].c; ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
      if(hasSpun){
        var mid = a0 + seg/2;
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(mid);
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#3a2b12';
        ctx.font = '900 52px Arial,sans-serif';
        ctx.fillText(WHEEL[i].w, r - 30, 0);
        ctx.restore();
      }
    }
    ctx.beginPath(); ctx.arc(cx,cy,62,0,2*Math.PI);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.lineWidth = 9; ctx.strokeStyle = '#F2994A'; ctx.stroke();
    ctx.fillStyle = '#C05A12'; ctx.font = '900 34px Arial,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('GO', cx, cy);
    ctx.beginPath(); ctx.moveTo(cx-30,8); ctx.lineTo(cx+30,8); ctx.lineTo(cx,58); ctx.closePath();
    ctx.fillStyle = '#EF3B2D'; ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
  }
  function spin(){
    if(spinning) return;
    spinning = true; hasSpun = true;
    var box = document.getElementById('wheelResult');
    box.classList.remove('pop');
    box.innerHTML = '<div class="qm">…</div>';
    var start = rot;
    var target = start + Math.PI*2*(5 + Math.floor(Math.random()*3)) + Math.random()*Math.PI*2;
    var dur = 4200, t0 = performance.now();
    (function frame(now){
      var p = Math.min(1,(now - t0)/dur);
      var e = 1 - Math.pow(1-p,3);
      rot = start + (target - start)*e;
      drawWheel();
      if(p < 1){ requestAnimationFrame(frame); } else { spinning = false; land(); }
    })(t0);
  }
  function land(){
    var n = WHEEL.length, seg = 2*Math.PI/n;
    var pt = -Math.PI/2;
    var rel = ((pt - rot) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
    var i = Math.floor(rel/seg) % n;
    var w = WHEEL[i];
    var box = document.getElementById('wheelResult');
    box.innerHTML = '<div class="word">'+w.w+'</div>';
    box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    shake(box);
    confetti();
    play(w.a);
  }
  var stars = 0;
  document.getElementById('spinBtn').addEventListener('click', spin);
  document.getElementById('starBtn').addEventListener('click', function(){
    stars++; document.getElementById('wheelScore').textContent = stars;
  });
  document.getElementById('starReset').addEventListener('click', function(){
    stars = 0; document.getElementById('wheelScore').textContent = 0;
  });

  /* ---------- price ---------- */
  var priceIdx = -1, priceTimer = null;
  function hanPrice(v){
    var d = ['零','一','二','三','四','五','六','七','八','九'];
    if(v < 10) return d[v];
    if(v < 20) return '十' + (v%10 ? d[v%10] : '');
    if(v < 100){ var t = Math.floor(v/10); return (t===1?'':d[t]) + '十' + (v%10 ? d[v%10] : ''); }
    var h = Math.floor(v/100), r2 = v%100;
    var s = d[h] + '百';
    if(r2 === 0) return s;
    if(r2 < 10) return s + '零' + d[r2];
    if(r2 < 20) return s + '一十' + (r2%10 ? d[r2%10] : '');
    return s + hanPrice(r2);
  }
  function animateRing(){
    var c = document.getElementById('ringProg'); var circ = 2*Math.PI*86;
    c.style.transition = 'none'; c.setAttribute('stroke','#27AE60'); c.style.strokeDashoffset = '0';
    void c.getBoundingClientRect();
    c.style.transition = 'stroke-dashoffset 3s linear';
    c.style.strokeDashoffset = String(circ);
    clearTimeout(priceTimer);
    priceTimer = setTimeout(function(){ c.setAttribute('stroke','#F2994A'); confetti(); }, 3000);
  }
  function newPrice(){
    var arr = DATA.numbers.price_examples;
    var i; do { i = Math.floor(Math.random()*arr.length); } while(arr.length>1 && i===priceIdx);
    priceIdx = i; var v = arr[i];
    document.getElementById('priceNum').textContent = v;
    document.getElementById('priceHan').textContent = hanPrice(v);
    play('price'+(i+1)+'.mp3');
    animateRing();
  }
  document.getElementById('nextPrice').addEventListener('click', newPrice);

  /* ---------- hanzi game ---------- */
  function buildHanzi(){
    var host = document.getElementById('hzgrid');
    host.innerHTML = DATA.hanzi.map(function(h){
      return '<button class="hcard" data-char="'+h.char+'" data-audio="hz_'+h.char+'.mp3">'
        + oracleSVG(h.char)
        + '<div class="reveal"><div class="hchar">'+h.char+'</div><div class="hpy">'+h.py+'</div><div class="hen">'+h.en+'</div></div>'
        + '</button>';
    }).join('');
    host.addEventListener('click', function(e){
      var c = e.target.closest ? e.target.closest('.hcard') : null;
      if(!c) return;
      var opening = !c.classList.contains('open');
      c.classList.toggle('open');
      if(opening) play('hz_'+c.dataset.char+'.mp3');
    });
  }

  /* ---------- generic audio click + keyboard ---------- */
  document.addEventListener('click', function(e){
    var s = e.target.closest ? e.target.closest('[data-audio]') : null;
    if(s && !s.classList.contains('hcard')){ play(s.dataset.audio); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key >= '1' && e.key <= '4'){
      var idx = parseInt(e.key,10) - 1;
      if(TAB_ORDER[idx]){ setTab(TAB_ORDER[idx]); }
      return;
    }
    if(document.getElementById('tab-teach').classList.contains('active')){
      if(e.key === 'ArrowRight'){ nextSlide(1); }
      if(e.key === 'ArrowLeft'){ nextSlide(-1); }
    }
  });

  /* ---------- init ---------- */
  var demo = new URLSearchParams(location.search).get('demo');
  buildTeach();
  buildHanzi();
  setSlide(0);
  var slideParam = new URLSearchParams(location.search).get('slide');
  if(slideParam !== null){ setSlide(parseInt(slideParam,10) - 1); }
  if(demo){ hasSpun = true; }
  var start = (location.hash || '').replace('#','');
  if(TAB_ORDER.indexOf(start) < 0) start = 'teach';
  setTab(start);
  if(start === 'price'){ newPrice(); }
  if(demo){ $$('#hzgrid .hcard').forEach(function(c){ c.classList.add('open'); }); }
  if(new URLSearchParams(location.search).get('diag')){
    setTimeout(function(){
      var act = document.querySelector('#slideHost .slide.active');
      var body = act ? act.querySelector('.slide-body') : null;
      var subs = act ? act.querySelectorAll('.subbar') : [];
      var last = subs.length ? subs[subs.length-1].getBoundingClientRect().bottom : null;
      document.documentElement.setAttribute('data-diag', JSON.stringify({
        innerH: window.innerHeight, docH: document.documentElement.scrollHeight,
        winW: window.innerWidth, docW: document.documentElement.scrollWidth,
        bodyH: body ? Math.round(body.getBoundingClientRect().height) : null,
        lastBottom: last ? Math.round(last) : null
      }));
    }, 1200);
  }
})();
</script>
</body>
