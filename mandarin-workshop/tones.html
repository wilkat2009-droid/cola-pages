<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四聲體操</title>
<style>
  :root { --ink:#1F2A37; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:#FFFDF7; color:var(--ink); height:100vh; overflow:hidden;
    font-family:"Helvetica Neue",Arial,"Kaiti TC",sans-serif;
    padding:1.6vh 18px 1.2vh; display:flex; flex-direction:column; }
  h1 { font-size:clamp(26px,4.6vh,60px); letter-spacing:5px; text-align:center;
       line-height:1.1; }
  .tag { text-align:center; font-size:clamp(12px,2vh,23px); color:#8A93A0;
         letter-spacing:2px; margin-bottom:1.4vh; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(8px,1.2vh,16px);
          flex:1; min-height:0; }
  .card { background:#fff; border-radius:18px; padding:1.4vh 14px 0; overflow:hidden;
    box-shadow:0 4px 16px rgba(31,42,55,.08); border-top:clamp(6px,1vh,10px) solid var(--c);
    display:flex; flex-direction:column; min-height:0; }
  .top { display:flex; align-items:flex-start; flex:0 0 auto; }
  .mark { font-size:clamp(28px,5vh,66px); font-weight:900; color:var(--c); line-height:1; }
  .num { margin-left:auto; font-size:clamp(15px,2.2vh,30px); font-weight:900; color:#fff;
         background:var(--c); width:1.8em; height:1.8em; border-radius:50%;
         display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .contour { width:100%; height:clamp(34px,7.5vh,86px); margin:.6vh 0 .2vh; flex:0 0 auto; }
  .py { font-size:clamp(18px,3.2vh,40px); font-weight:700; letter-spacing:1px; flex:0 0 auto; }
  .word { font-size:clamp(38px,8.4vh,104px); font-weight:900; line-height:1.02; flex:0 0 auto; }
  .en { font-size:clamp(11px,1.7vh,17px); color:#6B7280; margin-top:.3vh; flex:0 0 auto; }
  .gest { font-size:clamp(10px,1.6vh,16px); color:#9AA3AF; margin:.5vh 0 .8vh;
          line-height:1.4; flex:0 0 auto; }
  .kid { width:100%; margin-top:auto; display:block; object-fit:cover;
         object-position:top center; height:clamp(60px,21vh,250px);
         border-radius:14px 14px 0 0; flex:0 1 auto; min-height:0; }
  .final { text-align:center; margin-top:1.4vh; font-size:clamp(22px,5.2vh,60px);
           font-weight:900; letter-spacing:8px; flex:0 0 auto; }
  .final .p { display:block; font-size:clamp(12px,1.9vh,21px); font-weight:400;
              color:#8A93A0; letter-spacing:2px; margin-top:.4vh; }
  @media (max-width:900px) {
    body { height:auto; overflow:auto; }
    .grid { grid-template-columns:repeat(2,1fr); }
    .kid { height:150px; }
  }
</style>

<style>
/* 拼音字形保護：Arial 起頭，避免系統回退到 PingFang TC 使調號與字母分家 */
.py,.hpy,.mpy,.npy,.ppy,.sb-py,.tpy,.pc-py,.bk-npy,.py2,.py3,.qpy,.pyline { font-family: Arial, "Helvetica Neue", "Kaiti TC", sans-serif !important; }
</style>
</head>
